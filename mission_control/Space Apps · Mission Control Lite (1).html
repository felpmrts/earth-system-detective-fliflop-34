<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#020617;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#020617}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
@keyframes ignitionFlash{
  0%{opacity:0;transform:scale(0.92)}
  15%{opacity:1;transform:scale(1.02)}
  85%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(0.98)}
}
@keyframes rocketLift{
  0%{transform:translateY(16px) scale(0.9);opacity:0}
  20%{transform:translateY(-4px) scale(1.1);opacity:1}
  50%{transform:translateY(-8px) scale(1.15)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes shockwaveRing{
  0%{transform:scale(0.4);opacity:0.9}
  100%{transform:scale(2.4);opacity:0}
}
@keyframes pulseBorder{
  0%,100%{box-shadow:0 0 20px rgba(34,211,238,0.18), inset 0 0 24px rgba(34,211,238,0.06)}
  50%{box-shadow:0 0 42px rgba(34,211,238,0.38), inset 0 0 36px rgba(168,85,247,0.14)}
}
.hero-countdown{animation:pulseBorder 3s ease-in-out infinite}
.ignition-banner{animation:ignitionFlash 7s ease-out forwards}
.rocket-lift{animation:rocketLift 1.2s ease-out}
.shockwave-ring{animation:shockwaveRing 1.4s ease-out infinite}

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============ CONFIGURAÇÃO E DOMÍNIO OPERACIONAL (FONTE ÚNICA DA VERDADE v5.0) ============ */
const clock = { offset: 0, now() { return Date.now() + this.offset; } };
const nowIso = () => new Date(clock.now()).toISOString();
const uid = () => crypto.randomUUID ? crypto.randomUUID() : "id-" + clock.now().toString(36) + Math.random().toString(36).slice(2, 10);

const MS = {
  AVAILABLE: ["Disponível", "bg-cyan-400 text-slate-950", "bg-cyan-400"],
  WORKING:   ["Trabalhando", "bg-emerald-500 text-slate-950", "bg-emerald-400"],
  BLOCKED:   ["Bloqueado", "bg-amber-400 text-slate-950", "bg-amber-400"],
  RESTING:   ["Descansando", "bg-slate-300 text-slate-950", "bg-slate-400"]
};
const TS = ["BACKLOG", "READY", "IN_PROGRESS", "BLOCKED", "REVIEW", "DONE", "CANCELED"];
const TL = { BACKLOG: "Backlog", READY: "A fazer (Pronto)", IN_PROGRESS: "Em andamento", BLOCKED: "Bloqueado", REVIEW: "Em revisão", DONE: "Concluído", CANCELED: "Cancelada" };
const TD = { BACKLOG: "bg-slate-500", READY: "bg-sky-400", IN_PROGRESS: "bg-cyan-400", BLOCKED: "bg-amber-400", REVIEW: "bg-purple-400", DONE: "bg-emerald-400", CANCELED: "bg-slate-700" };
const PR = { P0: "text-rose-300 border-rose-500/50 bg-rose-500/10", P1: "text-amber-300 border-amber-500/50 bg-amber-500/10", P2: "text-slate-400 border-slate-600 bg-slate-800" };
const MO = ["", "MUST", "SHOULD", "COULD", "WONT"];
const OPEN = t => t.status !== "DONE" && t.status !== "CANCELED";

/* Especificação estática das 8 Fases + Janelas Operacionais */
const PHASES_SPEC = [
  { code: "F1", title: "Fase 1: Kickoff, Contrato JSON Unificado & Setup NASA POWER", window: "Sáb 09:00 – 10:30", startMin: 0, endMin: 90, leader: "COORD", summary: "Definir contrato JSON da matriz (A,X)x(B,Y), configurar repositório/backend e iniciar mapeamento no Gemini Deep Research." },
  { code: "F2", title: "Fase 2: Cliente NASA POWER (Células Adjacentes K<=9), Motor Estatístico & Mapa 2D Base", window: "Sáb 10:30 – 12:30", startMin: 90, endMin: 210, leader: "DADOS-1 / DADOS-2", summary: "DADOS-1 cria cliente NASA POWER /temporal/monthly/point + agregador livre K<=9 células adjacentes com Semaphore(3) e limpeza (-999, YYYY13, mm/day->mm/mês); DADOS-2 codifica stats_engine.py; PROD-1/2 criam Mapa 2D Leaflet Canvas (1 var/área no MVP) e Bancada de Gráficos; NARR analisa Gemini Deep Research." },
  { code: "F3", title: "Fase 3: Sistema de Análise de Dados Ponta a Ponta (Walking Skeleton)", window: "Sáb 12:30 – 16:00", startMin: 210, endMin: 420, leader: "COORD", summary: "Integrar Mapa 2D + NASA POWER ao vivo + Motor Estatístico + Gráficos respondendo às 3 Comparações Clássicas." },
  { code: "F4", title: "Fase 4: Bancada Científica Completa (Eixo Duplo, Z-Score, Log) & Chatbot Co-Piloto", window: "Sáb 16:00 – 21:30", startMin: 420, endMin: 750, leader: "Todos (Modular)", summary: "Finalizar Sistema de Análise de Dados (curvas juntas/separadas, correlação X vs Y, escala log/symlog, Chatbot Co-Piloto Estatístico integrado) e decidir escopo do Sistema de Descoberta Científica." },
  { code: "F5", title: "Fase 5: Sistema de Descoberta Científica (Início ML) & Blindagem dos Casos", window: "Sáb 21:30 – 23:30", startMin: 750, endMin: 870, leader: "NARR + DADOS-2", summary: "Iniciar protótipo do modelo de ML/mineração sobre nosso motor (Generalista ou Especializado no tema do Deep Research) + validar os 3 casos clássicos da demo." },
  { code: "SLEEP", title: "Pausa Obrigatória: Sono Sincronizado (~6h30)", window: "Sáb 23:30 – Dom 06:30", startMin: 870, endMin: 1290, leader: "COORD", summary: "Descanso sincronizado de toda a equipe após handoff de 3 linhas no canal. Proibido alterar o Contrato JSON ou refatorar componentes de madrugada." },
  { code: "F6", title: "Fase 6: Fechamento do Sistema de Descoberta Científica, Cache Offline & Feature Freeze", window: "Dom 06:30 – 13:00", startMin: 1290, endMin: 1680, leader: "COORD + PROD-1/2", summary: "Concluir achado do Sistema de Descoberta Científica, criar botões de Presets Científicos (cache instantâneo) e aplicar Feature Freeze às 13:00." },
  { code: "F7", title: "Fase 7: Produção Focada do Vídeo de Pitch (240s)", window: "Dom 13:30 – 19:00", startMin: 1710, endMin: 2040, leader: "NARR + PROD-2", summary: "Gravação 1080p60 demonstrando o Sistema de Análise de Dados + Chatbot + a inovação encontrada pelo Sistema de Descoberta Científica." },
  { code: "F8", title: "Fase 8: Submissão 'Quatro Olhos' & Testes Cegos 4G", window: "Dom 19:00 – 22:30", startMin: 2040, endMin: 2250, leader: "COORD + NARR", summary: "Preenchimento e revisão a quatro olhos no portal NASA Space Apps; bancada de jurados anônimos (DADOS-1/2, PROD-1/2) testando links em celulares via 4G/5G até 22:30 (90 min de buffer até 24:00)." }

/* Papéis, Módulos Exclusivos e Pares Anti-SPOF */
const ROLE_META = {
  "COORD":   { title: "Coordenação, Arquitetura, Backend & Deploy", backup: "NARR", modules: "Contrato JSON (A,X)x(B,Y), servidor de integração, controle de portões, decisão de escopo do Sistema de Descoberta Científica e submissão." },

  "DADOS-2": { title: "Motor Estatístico, Chatbot Co-Piloto & ML (Descoberta)", backup: "DADOS-1", modules: "Anomalias mensais, OLS + Theil-Sen, GAM, Mahalanobis, AR(1)+FDR, correlação/regressão cruzada X vs Y, Chatbot Co-Piloto Estatístico (definição de LLM + prompt) e modelo de ML do Sistema de Descoberta Científica." },
  "PROD-1":  { title: "Frontend: Mapa 2D & Seletor de Grade NASA (1x1, 2x2, 3x3)", backup: "PROD-2", modules: "Mapa 2D interativo, seleção de Local A e Local B (ou A=B), visualização dos quadrados da grade da NASA adaptados à variável (MERRA-2 55km vs CERES 111km) e seletores de variáveis/período." },
  "PROD-2":  { title: "Frontend: Bancada Científica de Gráficos & UI do Chatbot", backup: "PROD-1", modules: "Gráficos sobrepostos ou separados, Eixo Y Duplo, Z-Score, dado bruto vs anomalia, escala linear vs logarítmica, camadas OLS/Sen/GAM/Outliers, gráfico de dispersão X vs Y e painel do Chatbot Co-Piloto." },
  "NARR":    { title: "Gemini Deep Research, Casos Clássicos & Storytelling", backup: "COORD", modules: "Pesquisa profunda no Gemini Deep Research + Google Scholar para mapear fronteiras científicas, curadoria dos 3 casos clássicos da demo, roteiro e edição do vídeo de pitch." }
};

/* Catálogo de Dados NASA POWER API */
const DATA_CATALOG = [
  { id: "CLIMA", prio: "CLIMA", domain: "Clima & Calor", res: "MERRA-2 (0,5° × 0,625° ≈ 55×69 km)", name: "T2M, T2M_MAX, T2M_MIN, TS (°C)", scale: "Intervalar (PROIBIDO %)", planA: "NASA POWER /temporal/monthly/point (1981–Presente)", planB: "Cache Local JSON pré-aquecido dos pontos de demonstração" },
  { id: "AGUA", prio: "AGUA", domain: "Água & Umidade do Solo", res: "MERRA-2 (0,5° × 0,625° ≈ 55×69 km)", name: "GWETTOP, GWETROOT, GWETPROF (0–1), PRECTOTCORR (mm/dia), EVPTRNS (W/m²)", scale: "Razão (Zero físico real)", planA: "NASA POWER /temporal/monthly/point (1981–Presente)", planB: "Cache Local JSON + Recorte automático de datas" },
  { id: "ENERGIA", prio: "ENERGIA", domain: "Energia Solar & Nuvens", res: "CERES (1,0° × 1,0° ≈ 111×111 km)", name: "ALLSKY_SFC_SW_DWN (kWh/m²/dia), CLOUD_AMT (%)", scale: "Razão (Zero físico real)", planA: "NASA POWER /temporal/monthly/point (1984–Presente)", planB: "Interseção automática para 1984 quando cruzado com MERRA-2" },
  { id: "ATMOS", prio: "ATMOS", domain: "Atmosfera & Vento", res: "MERRA-2 (0,5° × 0,625° ≈ 55×69 km)", name: "RH2M (%), WS2M (m/s), PS (kPa)", scale: "Razão (Zero físico real)", planA: "NASA POWER /temporal/monthly/point (1981–Presente)", planB: "Padronização em Z-Score (σ) para cruzar qualquer unidade" }
];

/* Os 7 Invariantes Estatísticos de Estado da Arte */
const INVARIANTS = [
  { n: 1, danger: true, title: "PROIBIDO Y_fim − Y_início", desc: "Descartar a trajetória intermediária confunde El Niño com tendência secular. Toda taxa ('Quanto muda?') deve vir da regressão sobre toda a nuvem: B_OLS e Declive Mediano de Theil-Sen (B_Sen) por década (10 × B_ano)." },
  { n: 2, danger: false, title: "Isolamento Sazonal (Princípio Henrietta Leavitt)", desc: "Proibido regredir séries mensais brutas contaminadas pelo ciclo verão/inverno. Extrair primeiro a Anomalia Climatológica Mensal (Y'_{a,m} = Y_{a,m} − Ȳ_m) e garantir a mesma janela [t_0, t_f] entre regiões." },
  { n: 3, danger: true, title: "PROIBIDO % em Escala Intervalar", desc: "Zero porcentagem (%) para variáveis sem zero absoluto real (Temperatura em °C ou Anomalias de Água GRACE em cm). Exibir apenas diferenças (±X °C/década). % só em escalas de razão puras (km², mm)." },
  { n: 4, danger: false, title: "Distinção entre Inclinação (B) e Correlação (r / τ)", desc: "A regressão (B) informa quanto Y varia em função de X; a correlação (r de Pearson, τ de Kendall) informa quão estreita é a elipse de contorno (previsibilidade). Exibir ambos!" },
  { n: 5, danger: false, title: "Decomposição de Correlação Multiescala", desc: "Ao comparar 2 regiões, medir tanto a correlação secular de longo prazo (r_global) quanto a correlação residual de curto prazo sem tendência (r_detrended) para capturar dipolos como El Niño." },
  { n: 6, danger: false, title: "Modelagem Não-Linear com GAM/Splines", desc: "Nunca usar polinômios livres de grau alto. Combinar a reta de tendência com curva suave (GAM / Smoothing Spline) para revelar aceleração/saturação e diagnosticar 'corcovas' (sensor vs. El Niño vs. rampa)." },
  { n: 7, danger: false, title: "Outliers via Mahalanobis + Significância AR(1) & FDR", desc: "Destacar extremos fora da elipse bivariada (Distância de Mahalanobis D_M > 2,5) sem apagá-los; corrigir p-valor para autocorrelação serial AR(1) (N_efetivo) e aplicar Benjamini-Hochberg (q_FDR < 0,05) na grade do mapa." }
];

const OFFICIAL_ASSIGNEES = {
  "COORD": ["Rhyan", "Felipe"],
  "DADOS-1": ["Kaio", "Renan", "Felipe"],
  "DADOS-2": ["Rhyan", "Fred"],
  "PROD-1": ["Renan", "Fred"],
  "PROD-2": ["Kaio"],
  "NARR": ["Rhyan", "Felipe"]
};

function seed() {
  const st = new Date(clock.now());
  st.setHours(9, 0, 0, 0);
  st.setDate(st.getDate() + (6 - st.getDay() + 7) % 7);
  const at = min => new Date(st.getTime() + min * 6e4).toISOString();
  const roles = ["COORD", "DADOS-1", "DADOS-2", "PROD-1", "PROD-2", "NARR"];
  const members = roles.map(r => ({
    id: uid(),
    name: r,
    role: r,
    assignees: OFFICIAL_ASSIGNEES[r] || [],
    backup: ROLE_META[r].backup,
    modules: ROLE_META[r].modules,
    status: "AVAILABLE",
    currentTaskId: "",
    notes: ""
  }));
  const M = Object.fromEntries(roles.map((r, i) => [r, members[i].id]));

  const gatesRaw = [
    [1, "Marco 0: Contrato JSON Unificado (A,X)x(B,Y) + Repositório & Setup", 90, "IF debate de schema passar das 10:15 → THEN COORD congela o contrato JSON da matriz (A,X)x(B,Y) e inicia setup NASA POWER."],
    [2, "Portão 1: Cliente NASA POWER (Grade 1x1, 2x2, 3x3) + Motor Estatístico + UI Base", 210, "IF API NASA POWER sofrer rate limit às 11:45 → THEN DADOS-1 ativa cache local JSON dos pontos sentinelas em 10 min."],
    [3, "Portão 2: Walking Skeleton Integrado (Mapa 2D + NASA POWER + Gráficos)", 420, "IF integração completa não estiver no ar às 16:00 → THEN fixar grade 1x1 e 2 variáveis centrais (T2M e GWET) até 16:45."],
    [4, "Checkpoint 3: Bancada Científica Completa + Decisão ML Descoberta", 750, "IF dúvida entre ML Generalista vs Especializado às 21:30 → THEN adotar especialização no tema revelado pelo Gemini Deep Research."],
    [5, "Portão 4: Feature Freeze Absoluto + Presets Científicos em Cache", 1680, "IF qualquer modelo ou feature estiver instável às 13:00 → THEN congelar o que está funcional e ativar presets em cache offline."],
    [6, "Portão 5: Vídeo de Pitch (240s) Gravado em 1080p60 & Legendado", 2040, "IF edição passar das 17:30 → THEN cortar introdução teórica e focar na demo ao vivo da Análise de Dados e do Descoberta Científica."],
    [7, "Portão 6: Submissão 'Quatro Olhos' & Testes Cegos 4G (Buffer 90m)", 2250, "IF portal Space Apps oscilar às 21:30 → THEN registrar submissão preliminar e apenas validar links até 22:30."]
  ];
  const gates = gatesRaw.map(([n, title, offset, rule]) => ({ id: uid(), n, title, offset, rule, status: "pending" }));

  const T = (title, o, priority, dueMin, status, moscow, g, phase, notes = "") => ({
    id: uid(),
    title,
    ownerId: M[o],
    priority,
    due: dueMin ? at(dueMin) : "",
    status,
    blockedReason: "",
    moscow,
    gateId: g ? gates[g - 1].id : "",
    phase: phase || "F1",
    notes: notes || ""
  });

  return {
    app: "NASA Space Apps Mission Control",
    schema_version: "6.0",
    version: 1,
    updatedAt: nowIso(),
    updatedBy: "sistema",
    event: { start: st.toISOString(), minutes: 2340 },
    focus: "Trend Detective: Sistema de Análise de Dados da Terra (NASA POWER em Grade 1x1, 2x2 e 3x3 + Motor Estatístico + Chatbot Co-Piloto) & Sistema de Descoberta Científica (Gemini Deep Research + Machine Learning).",
    members,
    gates,
    tasks: [
      /* Fase 1: Kickoff, Contrato JSON Unificado & Setup NASA POWER (Sáb 09:00 - 10:30 | Marco 0 @ 90m) */
      T("Estruturar repositório Git, pastas Backend/Frontend, CI/CD e abrir DECISOES.md", "COORD", "P0", 90, "READY", "MUST", 1, "F1", "Configurar deploy contínuo (Vercel ou GitHub Pages) a partir da main. Abrir DECISOES.md para registrar congelamento de arquitetura. Garantir que todos tenham acesso de push."),
      T("Validar chamada real à NASA POWER API (/temporal/monthly/point) e mapear grades (0,5°×0,625° vs 1,0°×1,0°) para o Contrato", "DADOS-1", "P0", 90, "READY", "MUST", 1, "F1", "Validar endpoint mensal da NASA POWER sem autenticação obrigatória. Testar requisições para T2M, PRECTOTCORR e GWETTOP e mapear as grades de resolução para o Contrato JSON."),
      T("Especificar no Contrato JSON todos os campos de saída do Motor Estatístico (Anomalias, OLS, Sen, GAM, Mahalanobis, AR1+FDR)", "DADOS-2", "P0", 90, "READY", "MUST", 1, "F1", "Definir entradas, saídas e formatos numéricos do motor de estatística: anomalia mensal climatológica, inclinação OLS e Theil-Sen por década, resíduos GAM, distância de Mahalanobis e correção serial AR(1)+FDR."),
      T("Definir no Contrato JSON o estado do fluxo '1º Variável → 2º Onde (Local A/B + Grade 1x1, 2x2, 3x3) → 3º Tempo' e iniciar boilerplate Frontend", "PROD-1", "P0", 90, "READY", "MUST", 1, "F1", "Estruturar o payload do fluxo de usuário (variável define grade e ano inicial; coordenadas A e B com blocos 1x1, 2x2, 3x3; intervalo [t0, tf]) e configurar boilerplate Frontend."),
      T("Definir no Contrato JSON a estrutura das séries para a Bancada de Gráficos e gerar o arquivo mock_analysis.json", "PROD-2", "P0", 90, "READY", "MUST", 1, "F1", "Especificar a estrutura das séries (bruto, anomalia, Z-Score, retas OLS/Sen, elipse de Mahalanobis) para a Bancada Científica de Gráficos e gerar o arquivo mock_analysis.json para destravar o frontend."),
      T("Disparar pesquisa profunda no Gemini Deep Research + Google Scholar e validar regras oficiais de submissão da NASA", "NARR", "P0", 90, "READY", "MUST", 1, "F1", "Executar prompts aprofundados no Gemini Deep Research levantando anomalias térmicas e hídricas contemporâneas, papers recentes para o Sistema de Descoberta e validar todas as regras oficiais de submissão do portal Space Apps."),

      /* Fase 2: Cliente NASA POWER (Células Adjacentes K<=9), Motor Estatístico & Mapa 2D Base (Sáb 10:30 - 12:30 | Portão 1 @ 210m) */
      T("Construir cliente NASA POWER com agregador espacial de células adjacentes (1 <= K <= 9, ex: 1x1, 1x3, 2x1, 3x3) e Semaphore(3)", "DADOS-1", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Consultar /temporal/monthly/point (malha MERRA-2 0,5°×0,625°) com asyncio.Semaphore(3) (limite 30 req/min), descartar YYYY13, converter -999 -> np.nan + nanmean() e PRECTOTCORR mm/day -> mm/mês."),
      T("Implementar Cache Local no Backend (JSON/SQLite por célula e região, sem Parquet) e alinhador de datas (1981 MERRA-2 vs 1984 CERES)", "DADOS-1", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Salvar em JSON/SQLite local por célula (lat, lon, var) e região (Parquet descartado no Módulo 1) e garantir recorte temporal limpo (nota: idbCache.ts e interseção no frontend já prontos na branch frontend)."),
      T("Codificar stats_engine.py sobre o Mock: Anomalia Climatológica Mensal, OLS e Theil-Sen por década", "DADOS-2", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Implementar sobre o Mock a extração de anomalia Y'_{a,m} = Y_{a,m} - Ȳ_m (isolamento do ciclo sazonal) e regressão robusta calculando inclinação por década (10 x B_ano) via OLS e Theil-Sen."),
      T("Codificar no stats_engine.py: Curva GAM, Outliers Mahalanobis (D_M > 2,5) e teste AR(1)+FDR (Tendência Real vs Ruído)", "DADOS-2", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Implementar ajuste polinomial suavizado (GAM/spline) para aceleração/saturação, cálculo de Distância de Mahalanobis bivariada (D_M > 2,5) e teste de significância com p-valor corrigido para autocorrelação AR(1) e Benjamini-Hochberg FDR."),
      T("Construir componente visual <MapView /> em Leaflet (Canvas) e seletores (1 var/área no MVP + composição livre K <= 9) lendo o Mock", "PROD-1", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Renderizar <MapView /> em Leaflet Canvas consumindo gridGeometry.ts (snap + 8-vizinhos K<=9 já prontos na branch frontend), desenhando L.rectangle para Local A e Local B e controles temporais."),
      T("Construir casca da Bancada Científica de Gráficos (curvas juntas/separadas, Bruto vs Anomalia, retas OLS/Sen) lendo o Mock", "PROD-2", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Renderizar linha de tempo consumindo o mock_analysis.json: alternador instantâneo entre série bruta e anomalia sem sazonalidade, retas de tendência OLS/Sen, modo juntas/separadas e Eixo Y Duplo."),
      T("Analisar resultados do Gemini Deep Research, selecionar temas para o Sistema de Descoberta e fixar coordenadas dos casos de demo", "NARR", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Sintetizar as controvérsias e dados trazidos pela pesquisa de IA, pré-selecionar os temas para o modelo de Descoberta Científica e documentar as coordenadas lat/lon exatas dos 3 Casos Clássicos da demonstração."),

function migrate(o) {
  const base = seed();
  if (!o || typeof o !== "object") return base;
  const stMap = { working: "WORKING", blocked: "BLOCKED", resting: "RESTING" };
  return {
    ...base,
    schema_version: "6.0",
    version: (o.version || 1) + 1,
    updatedAt: o.updatedAt || nowIso(),
    updatedBy: o.updatedBy || "migração",
    event: { start: (o.event && o.event.start) || base.event.start, minutes: (o.event && o.event.minutes) || 2340 },
    focus: o.focus || (o.mvp && o.mvp.sentence) || base.focus,
    members: Array.isArray(o.members) && o.members.length === 6 ? o.members.map(m => {
      const r = m.role || m.name || "COORD";
      const meta = ROLE_META[r] || ROLE_META["COORD"];
      const baseAssignees = OFFICIAL_ASSIGNEES[r] || [];
      const hasAssignees = Array.isArray(m.assignees) && m.assignees.length > 0;
      return {
        id: m.id || uid(),
        name: m.name || r,
        role: r,
        assignees: hasAssignees ? m.assignees : baseAssignees,
        backup: m.backup || meta.backup,
        modules: m.modules || meta.modules,
        status: MS[m.status] ? m.status : (stMap[m.status] || "AVAILABLE"),
        currentTaskId: m.currentTaskId || "",
        notes: m.notes || ""
      };
    }) : base.members,
    gates: Array.isArray(o.gates) && o.gates.length >= 5 ? o.gates.map((g, idx) => ({
      id: g.id || uid(),
      n: g.n || (idx + 1),
      title: g.title,
      offset: typeof g.offset === "number" ? g.offset : (base.gates[idx] ? base.gates[idx].offset : 90),
      rule: g.rule || (base.gates[idx] ? base.gates[idx].rule : ""),
      status: ["pending", "passed", "failed"].includes(g.status) ? g.status : "pending"
    })) : base.gates,
    tasks: Array.isArray(o.tasks) && o.tasks.length ? o.tasks.map(t => ({
      id: t.id || uid(),
      title: t.title || "Tarefa",
      notes: t.notes || "",
      ownerId: t.ownerId || "",
      priority: PR[t.priority] ? t.priority : "P1",
      due: t.due || "",
      status: TS.includes(t.status) ? t.status : "BACKLOG",
      blockedReason: t.blockedReason || "",
      moscow: MO.includes(t.moscow || "") ? (t.moscow || "") : (t.priority === "P0" ? "MUST" : ""),
      gateId: t.gateId || "",
      phase: t.phase || "F1"
    })) : base.tasks,
    risks: Array.isArray(o.risks) && o.risks.length ? o.risks.map((r, idx) => ({
      id: r.id || uid(),
      code: r.code || `R${idx + 1}`,
      problem: r.problem || r.title || "",
      ownerId: r.ownerId || "",
      plan: r.plan || r.planB || r.mitigation || "",
      state: ["OPEN", "CLOSED"].includes(r.state) ? r.state : (r.status === "aberto" ? "OPEN" : "CLOSED")
    })) : base.risks,
    delivery: Array.isArray(o.delivery) && o.delivery.length ? o.delivery : base.delivery,
    scienceAudit: Array.isArray(o.scienceAudit) && o.scienceAudit.length ? o.scienceAudit : base.scienceAudit
  };
}

const IDR = /^[\w-]{6,}$/;
function validate(s) {
  const e = m => ({ ok: false, err: m });
  if (!s || typeof s !== "object") return e("Estado inválido");
  for (const k of ["members", "tasks", "gates", "risks", "delivery"]) if (!Array.isArray(s[k])) return e("Campo ausente: " + k);
  if (!s.event || isNaN(new Date(s.event.start)) || typeof s.event.minutes !== "number") return e("Dados do evento inválidos");
  if (s.gates.length < 5) return e("São necessários ao menos 5 marcos");
  const mid = new Set(s.members.map(m => m.id)), gid = new Set(s.gates.map(g => g.id));
  for (const m of s.members) if (!IDR.test(m.id) || !MS[m.status]) return e("Membro inválido");
  for (const g of s.gates) if (!IDR.test(g.id) || !["pending", "passed", "failed"].includes(g.status) || typeof g.offset !== "number") return e("Marco inválido");
  for (const t of s.tasks) {
    if (!IDR.test(t.id) || typeof t.title !== "string" || !TS.includes(t.status) || !PR[t.priority] || !MO.includes(t.moscow || "")) return e("Tarefa inválida: " + t.title);
    if (t.ownerId && !mid.has(t.ownerId)) return e("Responsável inexistente em: " + t.title);
    if (t.gateId && !gid.has(t.gateId)) return e("Marco inexistente em: " + t.title);
    if (t.due && isNaN(new Date(t.due))) return e("Prazo inválido em: " + t.title);
  }
  for (const r of s.risks) if (!["OPEN", "CLOSED"].includes(r.state) || (r.ownerId && !mid.has(r.ownerId))) return e("Risco inválido");
  return { ok: true };
}

/* ============ REPOSITORY COM PERSISTÊNCIA LOCAL (mc-v6) E SINCRONIZAÇÃO EM REDE WI-FI (LAN) ============ */
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

class LocalRepository {
  constructor() {
    this.l = new Set();
    this.me = ls.get("mc-me") || "";
    this.lanUrl = "";
    this.lanStatus = "offline"; // "connected" | "connecting" | "offline"
    this.lanError = "";
    this.es = null;
    this.isSyncingRemote = false;
    this.s = this.load();
    this.initLan();
  }
  load() {
    try {
      const v6 = ls.get("mc-v6");
      if (v6) {
        const r = JSON.parse(v6);
        if (r && (r.schema_version === "6.0" || r.schema_version === "5.0") && validate(r).ok) {
          if (!Array.isArray(r.scienceAudit)) r.scienceAudit = seed().scienceAudit;
          if (Array.isArray(r.members)) {
            r.members.forEach(m => {
              if ((!Array.isArray(m.assignees) || m.assignees.length === 0) && OFFICIAL_ASSIGNEES[m.role]) {
                m.assignees = OFFICIAL_ASSIGNEES[m.role];
              }
            });
          }
          r.schema_version = "6.0";
          return r;
        }
      }
    } catch (e) {}

    const fresh = seed();
    try {
      const v5 = ls.get("mc-v5") || ls.get("mc-v4");
      if (v5) {
        const old = JSON.parse(v5);
        if (old) {
          if (old.event) fresh.event = old.event;
          if (Array.isArray(old.members)) {
            fresh.members.forEach(m => {
              const om = old.members.find(x => (x.role && x.role === m.role) || (x.name && x.name === m.role));
              if (om) {
                if (Array.isArray(om.assignees) && om.assignees.length) m.assignees = om.assignees;
                if (om.status) m.status = om.status;
                if (om.notes) m.notes = om.notes;
              }
            });
          }
        }
      }
    } catch (e) {}

    ls.set("mc-v6", JSON.stringify(fresh));
    return fresh;
  }
  getState() { return this.s; }
  subscribe(f) { this.l.add(f); return () => this.l.delete(f); }
  userName() { const m = this.s.members.find(x => x.id === this.me); return m ? m.name : "anônimo"; }
  setMe(id) { this.me = id; ls.set("mc-me", id); this.notify(); }
  notify() { this.l.forEach(f => f()); }

  initLan() {
    if (typeof window !== "undefined" && window.location && window.location.protocol.startsWith("http")) {
      this.connectLan(window.location.origin);
    } else {
      const saved = ls.get("mc-lan-url");
      if (saved) this.connectLan(saved);
    }
  }

  connectLan(url) {
    const targetUrl = (url || "").trim().replace(/\/+$/, "");
    if (!targetUrl) return;
    if (typeof window !== "undefined" && (!window.location || !window.location.protocol.startsWith("http") || targetUrl !== window.location.origin)) {
      ls.set("mc-lan-url", targetUrl);
    }
    this.lanUrl = targetUrl;
    this.lanStatus = "connecting";
    this.lanError = "";
    this.notify();

    if (this.es) {
      try { this.es.close(); } catch (_) {}
      this.es = null;
    }

    // 1. Consulta o estado inicial do servidor
    fetch(targetUrl + "/api/state")
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(remote => {
        if (remote && remote.empty) {
          // Servidor vazio: inicializa com o estado local atual
          this.pushToLan(this.s);
        } else if (remote && validate(remote).ok) {
          if (!this.s || (remote.version && remote.version > this.s.version) || remote.updatedAt !== this.s.updatedAt) {
            this.applyRemote(remote);
          }
        }
        this.startEventSource(targetUrl);
      })
      .catch(err => {
        console.warn("Aviso ao conectar com LAN /api/state:", err);
        this.lanStatus = "offline";
        this.lanError = err.message || "Erro de conexão";
        this.notify();
        this.startEventSource(targetUrl);
      });
  }

  startEventSource(url) {
    if (this.es) {
      try { this.es.close(); } catch (_) {}
      this.es = null;
    }
    try {
      const es = new EventSource(url + "/api/events");
      this.es = es;
      es.onopen = () => {
        this.lanStatus = "connected";
        this.lanError = "";
        this.notify();
      };
      es.onerror = () => {
        if (this.es === es) {
          this.lanStatus = "offline";
          this.notify();
        }
      };
      es.onmessage = e => {
        try {
          const remote = JSON.parse(e.data);
          if (remote && validate(remote).ok) {
            if (!this.s || (remote.version && remote.version > this.s.version) || remote.updatedAt !== this.s.updatedAt) {
              this.applyRemote(remote);
            }
          }
        } catch (err) {
          console.warn("Erro ao decodificar evento SSE:", err);
        }
      };
    } catch (err) {
      this.lanStatus = "offline";
      this.lanError = err.message || "EventSource não suportado";
      this.notify();
    }
  }

  disconnectLan() {
    if (this.es) {
      try { this.es.close(); } catch (_) {}
      this.es = null;
    }
    this.lanStatus = "offline";
    this.lanUrl = "";
    ls.set("mc-lan-url", "");
    this.notify();
  }

  applyRemote(remote) {
    this.isSyncingRemote = true;
    try {
      this.s = remote;
      ls.set("mc-v6", JSON.stringify(remote));
      this.notify();
    } finally {
      this.isSyncingRemote = false;
    }
  }

  pushToLan(state) {
    if (!this.lanUrl) return;
    fetch(this.lanUrl + "/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).catch(err => console.warn("Falha ao propagar estado para LAN:", err));
  }

  commit(fn) {
    const s = structuredClone(this.s);
    fn(s);
    s.version++;
    s.updatedAt = nowIso();
    s.updatedBy = this.userName();
    this.s = s;
    ls.set("mc-v6", JSON.stringify(s));
    this.notify();
    if (!this.isSyncingRemote) {
      this.pushToLan(s);
    }
  }
  addTask(t) { this.commit(s => { s.tasks.push(t); }); }
  updateTask(id, p) { this.commit(s => Object.assign(s.tasks.find(x => x.id === id), p)); }
  deleteTask(id) { this.commit(s => { s.tasks = s.tasks.filter(x => x.id !== id); s.members.forEach(m => { if (m.currentTaskId === id) m.currentTaskId = ""; }); }); }
  updateMember(id, p) { this.commit(s => Object.assign(s.members.find(x => x.id === id), p)); }
  updateGate(id, p) { this.commit(s => Object.assign(s.gates.find(x => x.id === id), p)); }
  addRisk(r) { this.commit(s => { s.risks.push(r); }); }
  updateRisk(id, p) { this.commit(s => Object.assign(s.risks.find(x => x.id === id), p)); }
  backup() { ls.set("mc-v6-backup", JSON.stringify(this.s)); }
  replace(state) { this.backup(); this.commit(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, structuredClone(state)); }); }
  restore() { try { const b = JSON.parse(ls.get("mc-v6-backup")); if (!validate(b).ok) return false; this.replace(b); return true; } catch (e) { return false; } }
}

const COLS = ["members", "tasks", "gates", "risks", "delivery", "scienceAudit"], META = ["id", "order", "updatedAt", "updatedBy"], sleep = ms => new Promise(r => setTimeout(r, ms));

const bus = { impl: null, sh: null, fn: new Set(), status: HAS ? "connecting" : "local", lockMsg: HAS ? "Conectando ao servidor… aguarde" : "", say() {}, emit() { this.fn.forEach(f => f()); }, on(f) { this.fn.add(f); return () => this.fn.delete(f); } };

bus.impl = local;

const WR = new Set(["addTask", "updateTask", "deleteTask", "updateMember", "updateGate", "addRisk", "updateRisk", "commit", "replace", "restore", "connectLan", "disconnectLan"]);
const repo = new Proxy({}, {
  get(_, k) {
    if (k === "me") return ls.get("mc-me") || "";
    if (k === "setMe") return id => { ls.set("mc-me", id); local.me = id; if (bus.sh) bus.sh.me = id; bus.emit(); };
    if (k === "subscribe") return f => bus.on(f);

    if (k === "lanUrl") return local.lanUrl;
    if (k === "connectLan") return url => local.connectLan(url);
    if (k === "disconnectLan") return () => local.disconnectLan();
    const i = bus.impl, v = i[k];
    if (typeof v !== "function") return v;
    if (WR.has(k)) return (...a) => bus.lockMsg ? bus.say(bus.lockMsg) : v.apply(i, a);
    return v.bind(i);
  }
});
const useRepo = () => { const [, f] = useState(0); useEffect(() => repo.subscribe(() => f(x => x + 1)), []); return repo.getState(); };

/* ============ HELPERS TEMPORAIS E DE PROGRESSO ============ */
const T0 = s => new Date(s.event.start).getTime();
const Tend = s => T0(s) + (s.event.minutes || 2340) * 6e4;
const gAt = (s, g) => T0(s) + g.offset * 6e4;
const freezeOn = (s, now) => { const g = s.gates.find(x => x.n === 5) || s.gates.find(x => x.offset === 1680); return g ? (now >= gAt(s, g) || g.status === "passed") : false; };

/* Formatação com segundos para cronômetro regressivo de alta precisão */
const durSec = ms => {
  const totalSec = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, "0");
  return (d ? `${d}d ` : "") + `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
};
const dur = ms => {
  const m = Math.floor(Math.abs(ms) / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return (d ? d + "d " : "") + `${h}h ${String(m % 60).padStart(2, "0")}m`;
};
const fmtAt = ts => new Date(ts).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const toLoc = iso => { if (!iso) return ""; const d = new Date(iso), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fromLoc = v => v ? new Date(v).toISOString() : "";
const memberLabel = m => {
  if (!m) return "—";
  const list = Array.isArray(m.assignees) && m.assignees.length ? m.assignees : (m.name && m.name !== m.role ? [m.name] : []);
  return list.length ? `${m.role || m.name} (${list.join(", ")})` : (m.role || m.name);
};
const nm = (s, id) => {
  const m = s.members.find(x => x.id === id);
  if (!m) return "—";
  const list = Array.isArray(m.assignees) && m.assignees.length ? m.assignees : (m.name && m.name !== m.role ? [m.name] : []);
  return list.length ? `${m.role} · ${list.join(", ")}` : m.name;
};
const mOpts = (s, ph = "—") => [["", ph], ...s.members.map(m => [m.id, memberLabel(m)])];
const allPeople = s => {
  const map = new Map();
  s.members.forEach(m => {
    const list = Array.isArray(m.assignees) && m.assignees.length ? m.assignees : (m.name && m.name !== m.role ? [m.name] : []);
    list.forEach(p => {
      const k = p.trim();
      if (!k) return;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(m);
    });
  });
  return Array.from(map.entries()).map(([person, roles]) => ({ person, roles }));
};
const late = (t, now) => OPEN(t) && t.due && new Date(t.due).getTime() < now;
const pct = a => a.length ? Math.round(a.filter(t => t.status === "DONE").length / a.length * 100) : 0;

/* Identifica a Fase Atual com base nos minutos decorridos desde T0 */
function currentPhaseInfo(s, now) {
  const elapsedMin = (now - T0(s)) / 6e4;
  if (elapsedMin < 0) return { state: "PRE", elapsedMin, phase: PHASES_SPEC[0], label: "Pré-Kickoff (Aguardando Largada Sáb 09:00)" };
  if (elapsedMin >= 2340) return { state: "POST", elapsedMin, phase: PHASES_SPEC[PHASES_SPEC.length - 1], label: "Hackathon Encerrado (Prazo Dom 24:00 Concluído)" };
  if (elapsedMin >= 2250) return { state: "BUFFER", elapsedMin, phase: PHASES_SPEC[PHASES_SPEC.length - 1], label: "Buffer Exclusivo de Contingência (Dom 22:30 – 24:00)" };
  if (elapsedMin >= 1680 && elapsedMin < 1710) return { state: "LUNCH", elapsedMin, phase: PHASES_SPEC[6], label: "Almoço & Setup Silencioso de Gravação (Dom 13:00 – 13:30)" };
  const found = PHASES_SPEC.find(p => elapsedMin >= p.startMin && elapsedMin < p.endMin) || PHASES_SPEC[0];
  return { state: "ACTIVE", elapsedMin, phase: found, label: found.title };
}

          <div className="mt-3 pt-2 border-t border-slate-800 flex flex-wrap items-center gap-1.5">

                key={p.code}

            <div className="flex-1 min-w-[240px]">
              <div className="text-xs font-bold text-white">{activePhase.title} <span className="text-cyan-300 font-mono">({activePhase.window})</span></div>

            </div>
            {activePhase.code !== "SLEEP" && (
              <button onClick={() => goTasksPhase(activePhase.code)} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-cyan-400/20 text-cyan-300 border border-cyan-400/40 hover:bg-cyan-400/30 shrink-0">
                Ver Tarefas de {activePhase.code} →

            )}

      {/* FOCO / CENTRO DE GRAVIDADE EDITÁVEL */}
      <Tx v={s.focus} on={v => repo.commit(x => { x.focus = v; })} placeholder="Centro de Gravidade (Schwerpunkt) e promessa do MVP…" />

      {/* QUADRO DE EXECUÇÃO EM TEMPO REAL: EM ANDAMENTO, BLOQUEIOS, EQUIPE E ATENÇÃO */}
      <div className="grid lg:grid-cols-2 gap-4">
        <Card>
          <H right={<span className="mono text-xs text-cyan-300">{doing.length} ativa(s)</span>}>Em Andamento Agora</H>
          {doing.length ? <div className="space-y-1">{doing.map(t => <T key={t.id} t={t} />)}</div> : <p className="text-sm text-slate-500">Nenhuma tarefa marcada como "Em andamento". Puxe uma tarefa na aba Tasks.</p>}
        </Card>

        <Card className={blk.length || s.members.some(m => m.status === "BLOCKED") ? "border-amber-500/70 bg-amber-950/15" : ""}>
          <H>Bloqueios & Alerta de Gargalo (Regra dos 5 Minutos)</H>
          {!blk.length && !s.members.some(m => m.status === "BLOCKED") && <p className="text-sm text-emerald-300">✓ Nenhum bloqueio ativo na equipe.</p>}
          {blk.map(t => (
            <div key={t.id} className="text-sm text-amber-200 py-1 border-b border-slate-800/80 last:border-0">
              ⚠ <b>[{t.phase}]</b> {t.title} <span className="text-slate-400">({nm(s, t.ownerId)})</span>
              <div className="text-xs text-amber-300/80">Motivo: {t.blockedReason || "não informado — acionar Par de Backup ou COORD em 5 min"}</div>
            </div>
          ))}
          {s.members.filter(m => m.status === "BLOCKED" && !blk.some(t => t.ownerId === m.id)).map(m => (
            <div key={m.id} className="text-sm text-amber-200">⚠ {m.name} (Par Backup: {m.backup || ROLE_META[m.role]?.backup}){m.notes ? ": " + m.notes : " precisa de desbloqueio"}</div>
          ))}
        </Card>

        <Card>
          <H right={<span className="text-[11px] text-slate-400">6 Pessoas · 4 Trilhas Paralelas</span>}>Status da Equipe & Progresso Individual</H>
          <div className="space-y-2">
            {s.members.map(m => {
              const mTasks = s.tasks.filter(t => t.ownerId === m.id && t.status !== "CANCELED");
              const mPct = pct(mTasks);
              return (
                <div key={m.id} className="flex items-center gap-2 text-sm">
                  <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${MS[m.status][2]}`} />
                  <b className="w-20 font-mono text-xs truncate">{m.name}</b>
                  <span className="text-xs text-slate-400 flex-1 truncate">{m.status === "RESTING" ? "Descansando (Sono)" : memberTask(m) || MS[m.status][0]}</span>
                  <span className="mono text-[11px] text-cyan-300 w-9 text-right">{mPct}%</span>
                </div>
              );
            })}
          </div>
        </Card>

        <Card>
          <H>Radar de Atenção do Coordenador (COORD)</H>
          {lt.length > 0 && <div className="mb-2"><div className="text-[11px] text-rose-300 font-semibold">ATRASADAS ({lt.length})</div>{lt.slice(0, 5).map(t => <T key={t.id} t={t} />)}</div>}
          {nx && (
            <div className="mb-2">
              <div className="text-[11px] text-cyan-300 font-semibold">PENDENTES PARA “{nx.title.toUpperCase()}” ({rel.length})</div>
              {rel.length ? rel.slice(0, 6).map(t => <T key={t.id} t={t} />) : <p className="text-xs text-emerald-300">✓ Todas as tarefas deste marco já foram concluídas.</p>}
            </div>
          )}
          {p0.length > 0 && <div><div className="text-[11px] text-amber-300 font-semibold">TAREFAS CRÍTICAS P0 EM ABERTO ({p0.length})</div>{p0.slice(0, 4).map(t => <T key={t.id} t={t} />)}</div>}
          {s.risks.some(r => r.state === "OPEN") && <p className="text-xs text-amber-300 mt-2">⚠ {s.risks.filter(r => r.state === "OPEN").length} risco(s) monitorado(s) na matriz (R1–R7) — ver aba Delivery</p>}
        </Card>
      </div>

      {/* LISTA COMPLETA DOS 7 MARCOS / PORTÕES E SUAS REGRAS IF/THEN */}
      <Card>
        <H right={<span className="text-[11px] text-slate-400">Clique no botão de status para aprovar ou acionar contingência</span>}>Os 7 Marcos e Portões Inegociáveis (Hard Gates & Regras IF/THEN)</H>
        <div className="space-y-2.5 mt-2">
          {gs.map(g => (
            <div key={g.id} className="p-2.5 rounded-xl bg-slate-950/60 border border-slate-800/90 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="space-y-0.5">
                <div className="flex items-center gap-2 text-sm font-medium">
                  <span className={`w-3 h-3 rounded-full shrink-0 ${g.status === "passed" ? "bg-emerald-400" : g.status === "failed" ? "bg-rose-500" : "bg-slate-600"}`} />
                  <span className={g.status === "passed" ? "text-slate-400 line-through" : "text-slate-100"}>{g.title}</span>
                  <span className="text-xs font-mono text-cyan-300">· {fmtAt(gAt(s, g))}</span>
                </div>
                {g.rule && <div className="text-[11px] text-slate-400 pl-5"><b className="text-amber-300/90 font-mono">Contingência:</b> {g.rule}</div>}
              </div>
              <button
                onClick={() => repo.updateGate(g.id, { status: g.status === "pending" ? "passed" : g.status === "passed" ? "failed" : "pending" })}
                className={`text-xs font-semibold px-3 py-1.5 rounded-lg shrink-0 ${g.status === "passed" ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40" : g.status === "failed" ? "bg-rose-500/20 text-rose-300 border border-rose-500/40" : "bg-slate-800 text-slate-300 border border-slate-700"}`}
              >
                {g.status === "pending" ? "⏳ Pendente" : g.status === "passed" ? "✓ Aprovado" : "⚠ Contingência Ativa"}
              </button>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============ ABA 2: TASKS (RASTREAMENTO POR MEMBRO, FASE E KANBAN) ============ */
function TaskModal({ t, s, now, onClose }) {
  if (!t) return null;
  const set = p => repo.updateTask(t.id, p);
  const ld = late(t, now);
  const owner = s.members.find(m => m.id === t.ownerId);
  const phaseObj = PHASES_SPEC.find(p => p.code === (t.phase || "F1"));

  return (
    <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6" onClick={onClose}>
      <div className="w-full max-w-2xl bg-slate-900 border border-cyan-500/40 rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-3 border-b border-slate-800 pb-3">
          <div className="space-y-1 flex-1">
            <div className="flex flex-wrap items-center gap-1.5">
              <Chip c="border-cyan-500/40 text-cyan-300 bg-cyan-950/40 font-mono">{t.phase || "F1"}</Chip>
              <Chip c={PR[t.priority]}>{t.priority}</Chip>
              {t.moscow && <Chip c="border-emerald-500/40 text-emerald-300">{t.moscow}</Chip>}
              <Chip c="border-slate-700 text-slate-300">{TL[t.status]}</Chip>
              {ld && <Chip c="border-rose-500/60 text-rose-300">ATRASADA</Chip>}
            </div>
            <div className="text-xs text-slate-400 font-mono">{phaseObj ? `${phaseObj.title} (${phaseObj.window})` : ""}</div>
          </div>
          <button onClick={onClose} className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300">✕ Fechar</button>
        </div>

        <div>
          <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Título da Tarefa / Entregável</label>
          <Tx v={t.title} on={v => v.trim() && set({ title: v.trim() })} />
        </div>

        <div>
          <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Notas Detalhadas / Critérios / Links</label>
          <textarea
            className={`${inp} min-h-[110px] leading-relaxed`}
            defaultValue={t.notes || ""}
            placeholder="Descreva aqui detalhes técnicos, links de arquivos, comandos ou observações importantes para quem assumir esta tarefa…"
            onBlur={e => { if (e.target.value !== (t.notes || "")) set({ notes: e.target.value }); }}
          />
        </div>

        <div className="grid sm:grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Cargo / Frente Responsável</label>
            <Sel v={t.ownerId} on={v => set({ ownerId: v })} o={mOpts(s, "Sem responsável")} />
            {owner && Array.isArray(owner.assignees) && owner.assignees.length > 0 && (
              <div className="text-[11px] text-cyan-300 mt-1 font-mono">Equipe neste cargo: {owner.assignees.join(", ")}</div>
            )}
          </div>
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Status no Kanban</label>
            <Sel v={t.status} on={v => set({ status: v })} o={TS.map(k => [k, TL[k]])} />
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Fase</label>
            <Sel v={t.phase || "F1"} on={v => set({ phase: v })} o={PHASES_SPEC.filter(p => p.code !== "SLEEP").map(p => [p.code, p.code])} />
          </div>
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Prioridade</label>
            <Sel v={t.priority} on={v => set({ priority: v })} o={["P0", "P1", "P2"].map(x => [x, x])} />
          </div>
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">MoSCoW</label>
            <Sel v={t.moscow} on={v => set({ moscow: v })} o={MO.map(x => [x, x || "—"])} />
          </div>
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Marco / Portão</label>
            <Sel v={t.gateId} on={v => set({ gateId: v })} o={[["", "Opcional"], ...s.gates.map(g => [g.id, `G${g.n}: ${g.title.slice(0, 22)}`])]} />
          </div>
        </div>

        <div className="grid sm:grid-cols-2 gap-3">
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Prazo (Deadline)</label>
            <input type="datetime-local" className={inp} value={toLoc(t.due)} onChange={e => set({ due: fromLoc(e.target.value) })} />
          </div>
          <div>
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Motivo de Bloqueio (se bloqueada)</label>
            <Tx v={t.blockedReason} on={v => set({ blockedReason: v })} placeholder="Ex.: Aguardando API ou revisão…" />
          </div>
        </div>

        <div className="flex items-center justify-between pt-3 border-t border-slate-800 flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <button
              onClick={() => {
                repo.deleteTask(t.id);
                bus.say("Tarefa excluída");
                onClose();
              }}
              className="bg-rose-500/15 border border-rose-500/40 text-rose-300 px-3 py-1.5 rounded-lg text-xs hover:bg-rose-500/25 transition font-medium"
            >
              🗑 Excluir Tarefa
            </button>
            <button
              onClick={() => {
                set({ status: "BLOCKED" });
                bus.say("Tarefa movida para Bloqueado");
              }}
              className="bg-amber-500/15 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-lg text-xs hover:bg-amber-500/25 transition font-medium"
            >
              ⚠ Mover para Bloqueado
            </button>
          </div>
          <button onClick={onClose} className="px-4 py-1.5 rounded-lg bg-cyan-400 text-slate-950 font-semibold text-xs hover:bg-cyan-300 transition">Concluir Edição</button>
        </div>
      </div>
    </div>
  );
}

function TaskCard({ t, s, now, onExpand }) {
  const [dragging, setDragging] = useState(false);
  const set = p => repo.updateTask(t.id, p), ld = late(t, now);
  const owner = s.members.find(m => m.id === t.ownerId);
  const people = owner && Array.isArray(owner.assignees) && owner.assignees.length ? owner.assignees.join(", ") : "";

  return (
    <div
      draggable="true"
      onDragStart={e => {
        setDragging(true);
        e.dataTransfer.setData("text/plain", t.id);
        e.dataTransfer.effectAllowed = "move";
      }}
      onDragEnd={() => setDragging(false)}
      className={`bg-slate-900 border rounded-xl p-3 space-y-2 cursor-grab active:cursor-grabbing transition ${dragging ? "opacity-40 scale-[0.98] border-cyan-400" : ld ? "border-rose-500/60 hover:border-rose-400" : "border-slate-800 hover:border-cyan-500/40"}`}
    >
      <div className="flex gap-2 items-start">
        <button
          aria-label="Concluir"
          onClick={() => set({ status: t.status === "DONE" ? "READY" : "DONE", blockedReason: "" })}
          className={`mt-0.5 w-5 h-5 rounded-md border-2 shrink-0 text-[11px] leading-none ${t.status === "DONE" ? "bg-emerald-400 border-emerald-400 text-slate-950 font-bold" : "border-slate-600 text-transparent"}`}
        >
          ✓
        </button>
        <span className={`text-sm flex-1 leading-snug break-words ${t.status === "DONE" || t.status === "CANCELED" ? "line-through text-slate-500" : "text-slate-100"}`}>{t.title}</span>
      </div>

      <div className="flex flex-wrap gap-1">
        <Chip c="border-cyan-500/40 text-cyan-300 bg-cyan-950/30 font-mono">{t.phase || "F1"}</Chip>
        <Chip c={PR[t.priority]}>{t.priority}</Chip>
        {t.moscow && <Chip c={t.moscow === "MUST" ? "border-emerald-500/40 text-emerald-300" : "border-slate-700 text-slate-400"}>{t.moscow}</Chip>}
        {t.due && <Chip c={ld ? "border-rose-500/60 text-rose-300" : "border-slate-700 text-slate-400"}>{ld ? "atrasada · " : ""}{fmtAt(t.due)}</Chip>}
      </div>

      {t.notes && <p className="text-[11px] text-slate-400 line-clamp-2 leading-relaxed">{t.notes}</p>}
      {t.status === "BLOCKED" && <Tx v={t.blockedReason} on={v => set({ blockedReason: v })} placeholder="Por que está bloqueado?" />}

      <div className="grid grid-cols-2 gap-1.5">
        <Sel v={t.ownerId} on={v => set({ ownerId: v })} o={mOpts(s, "Sem resp.")} c="text-xs" />
        <Sel v={t.status} on={v => set({ status: v })} o={TS.map(k => [k, TL[k]])} c="text-xs" />
      </div>

      <div className="flex items-center justify-between pt-1 border-t border-slate-800/70 gap-1.5">
        <span className="text-[11px] text-slate-400 truncate max-w-[130px]" title={people}>{people ? `👤 ${people}` : "Arraste para mover"}</span>
        <div className="flex items-center gap-1.5 shrink-0">
          <button
            title="Excluir tarefa"
            onClick={e => {
              e.stopPropagation();
              repo.deleteTask(t.id);
              bus.say("Tarefa excluída");
            }}
            className="text-xs text-slate-500 hover:text-rose-400 px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-rose-950/40 border border-slate-700/80 hover:border-rose-500/40 transition"
          >
            🗑
          </button>
          <button onClick={() => onExpand(t.id)} className="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 hover:bg-cyan-500/20 text-cyan-300 border border-slate-700 hover:border-cyan-400/50 transition">
            ⤢ Expandir
          </button>
        </div>
      </div>
    </div>
  );
}

function Tasks({ s, now, say, initPhase, clearInitPhase, mePerson }) {
  const [n, setN] = useState({
    title: "",
    ownerId: "",
    priority: "P0",
    moscow: "MUST",
    phase: "F1",
    status: "READY",
    due: "",
    notes: ""
  });
  const [showNotes, setShowNotes] = useState(false);
  const titleInputRef = useRef(null);
  const [roleFilter, setRoleFilter] = useState("ALL");
  const [personFilter, setPersonFilter] = useState("ALL");
  const [phaseFilter, setPhaseFilter] = useState(initPhase || "ALL");
  const [ok, setOk] = useState(false);
  const [cn, setCn] = useState(false);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  useEffect(() => {
    if (initPhase) {
      setPhaseFilter(initPhase);
      clearInitPhase();
    }
  }, [initPhase]);

  const frz = freezeOn(s, now);
  const add = () => {
    if (!n.title.trim()) return;
    if (frz && !ok) return say("🔒 Feature Freeze ativo: confirme que é bugfix/doc/integração");
    repo.addTask({
      id: uid(),
      title: n.title.trim(),
      notes: n.notes ? n.notes.trim() : "",
      ownerId: n.ownerId || repo.me || "",
      priority: n.priority,
      due: n.due,
      status: n.status || "READY",
      blockedReason: n.status === "BLOCKED" ? "Bloqueado na criação" : "",
      moscow: n.moscow || "MUST",
      gateId: "",
      phase: n.phase || "F1"
    });
    say(`Tarefa criada em ${TL[n.status || "READY"]}!`);
    setN(prev => ({ ...prev, title: "", notes: "", due: "" }));
    setShowNotes(false);
    setOk(false);
  };

  const startAddInCol = colKey => {
    setN(prev => ({ ...prev, status: colKey }));
    if (titleInputRef.current) {
      titleInputRef.current.focus();
      titleInputRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  };

  const peopleList = allPeople(s);

  const list = s.tasks.filter(t => {
    const owner = s.members.find(x => x.id === t.ownerId);
    if (roleFilter === "MINE") {
      if (mePerson) {
        if (!owner || !Array.isArray(owner.assignees) || !owner.assignees.includes(mePerson)) return false;
      } else if (t.ownerId !== repo.me) return false;
    }
    if (roleFilter === "P0" && t.priority !== "P0") return false;
    if (roleFilter !== "ALL" && roleFilter !== "MINE" && roleFilter !== "P0") {
      if (!owner || owner.role !== roleFilter) return false;
    }
    if (personFilter !== "ALL") {
      if (!owner || !Array.isArray(owner.assignees) || !owner.assignees.includes(personFilter)) return false;
    }
    if (phaseFilter !== "ALL" && (t.phase || "F1") !== phaseFilter) return false;
    return true;
  });

  const activeList = list.filter(t => t.status !== "CANCELED");
  const expandedTask = expandedId ? s.tasks.find(x => x.id === expandedId) : null;

  const Ch = ({ active, onClick, children }) => (
    <button onClick={onClick} className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${active ? "bg-cyan-400 text-slate-950 border-cyan-400 font-semibold" : "bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-500"}`}>
      {children}
    </button>
  );

  const handleDrop = (e, targetStatus) => {
    e.preventDefault();
    setDragOverCol(null);
    const taskId = e.dataTransfer.getData("text/plain");
    if (!taskId) return;
    const task = s.tasks.find(x => x.id === taskId);
    if (!task || task.status === targetStatus) return;
    repo.updateTask(taskId, {
      status: targetStatus,
      blockedReason: targetStatus === "BLOCKED" ? task.blockedReason : ""
    });
    say(`Movida para ${TL[targetStatus]}`);
  };

  return (
    <div className="space-y-3">
      {frz && <FreezeBanner />}

      {/* BARRA DE PROGRESSO DAS TAREFAS FILTRADAS */}
      <Card className="p-3">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-1.5">
          <span className="text-xs font-semibold text-cyan-300 uppercase tracking-wider">Progresso do Filtro Atual ({activeList.filter(t => t.status === "DONE").length}/{activeList.length} concluídas)</span>
          <span className="mono text-sm font-bold text-emerald-300">{pct(activeList)}%</span>
        </div>
        <Bar p={pct(activeList)} c="bg-emerald-400" />
      </Card>

      {/* CRIAR NOVA TAREFA COMPLETA & RÁPIDA */}
      <Card className="border-slate-800 bg-slate-900/90 space-y-2.5">
        <div className="flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <span className="text-xs font-semibold text-cyan-300 uppercase tracking-wider font-mono">+ Criar Tarefa no Kanban</span>
            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full border ${n.status === "READY" ? "bg-sky-950/60 text-sky-300 border-sky-500/40" : n.status === "BACKLOG" ? "bg-slate-800 text-slate-300 border-slate-700" : n.status === "IN_PROGRESS" ? "bg-cyan-950/60 text-cyan-300 border-cyan-500/40" : "bg-amber-950/60 text-amber-300 border-amber-500/40"}`}>
              Coluna: {TL[n.status || "READY"]}
            </span>
          </div>
          <button
            type="button"
            onClick={() => setShowNotes(!showNotes)}
            className={`text-xs font-mono px-2.5 py-1 rounded-lg border transition ${showNotes ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" : "bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200"}`}
          >
            {showNotes ? "▲ Ocultar Descrição" : "📝 + Descrição / Notas"}
          </button>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2">
          {/* Título da tarefa */}
          <div className="sm:col-span-2 lg:col-span-4">
            <input
              ref={titleInputRef}
              className={inp}
              placeholder="Título da tarefa ou entregável…"
              value={n.title}
              onChange={e => setN({ ...n, title: e.target.value })}
              onKeyDown={e => e.key === "Enter" && add()}
            />
          </div>

          {/* Coluna / Status inicial */}
          <div className="lg:col-span-2">
            <Sel
              v={n.status || "READY"}
              on={v => setN({ ...n, status: v })}
              o={[["READY", "A Fazer (Pronto)"], ["BACKLOG", "Backlog"], ["IN_PROGRESS", "Em Andamento"], ["BLOCKED", "Bloqueado"]]}
            />
          </div>

          {/* Fase */}
          <div className="lg:col-span-1">
            <Sel
              v={n.phase}
              on={v => setN({ ...n, phase: v })}
              o={PHASES_SPEC.filter(p => p.code !== "SLEEP").map(p => [p.code, p.code])}
            />
          </div>

          {/* Cargo Responsável */}
          <div className="lg:col-span-2">
            <Sel
              v={n.ownerId || repo.me}
              on={v => setN({ ...n, ownerId: v })}
              o={mOpts(s, "Cargo Resp.")}
            />
          </div>

          {/* Prioridade e MoSCoW */}
          <div className="flex gap-1.5 lg:col-span-2">
            <Sel
              v={n.priority}
              on={v => setN({ ...n, priority: v })}
              o={["P0", "P1", "P2"].map(x => [x, x])}
              c="w-1/2"
            />
            <Sel
              v={n.moscow}
              on={v => setN({ ...n, moscow: v })}
              o={["MUST", "SHOULD", "COULD"].map(x => [x, x])}
              c="w-1/2"
            />
          </div>

          {/* Botão de criar */}
          <div className="sm:col-span-2 lg:col-span-1">
            <button
              onClick={add}
              className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg px-3 py-1.5 text-xs transition"
            >
              + Criar
            </button>
          </div>
        </div>

        {/* Campo expansível de Descrição / Notas Detalhadas */}
        {showNotes && (
          <div className="pt-2 border-t border-slate-800">
            <label className="text-[11px] font-mono uppercase text-slate-400 block mb-1">Descrição / Notas Detalhadas (opcional)</label>
            <textarea
              className={`${inp} min-h-[75px] text-xs leading-relaxed`}
              placeholder="Explique critérios de aceite, comandos, links ou orientações para a tarefa…"
              value={n.notes}
              onChange={e => setN({ ...n, notes: e.target.value })}
            />
          </div>
        )}

        {frz && <label className="flex items-center gap-2 text-xs text-rose-300 mt-2"><input type="checkbox" checked={ok} onChange={e => setOk(e.target.checked)} /> Confirmo que não é feature nova (apenas correção de bug, doc, integração ou vídeo)</label>}
      </Card>

      {/* FILTROS POR CARGO, POR PESSOA E POR FASE */}
      <div className="space-y-2">
        <div className="flex flex-wrap items-center gap-1.5">
          <span className="text-[11px] font-mono uppercase text-slate-400 mr-1">Cargo / Frente:</span>
          <Ch active={roleFilter === "ALL"} onClick={() => setRoleFilter("ALL")}>Todas ({s.tasks.filter(t => t.status !== "CANCELED").length})</Ch>
          <Ch active={roleFilter === "MINE"} onClick={() => setRoleFilter("MINE")}>Minhas{mePerson ? ` (${mePerson})` : ""}</Ch>
          <Ch active={roleFilter === "P0"} onClick={() => setRoleFilter("P0")}>Críticas P0</Ch>
          {["COORD", "DADOS-1", "DADOS-2", "PROD-1", "PROD-2", "NARR"].map(r => (
            <Ch key={r} active={roleFilter === r} onClick={() => setRoleFilter(r)}>{r}</Ch>
          ))}
        </div>

        {peopleList.length > 0 && (
          <div className="flex flex-wrap items-center gap-1.5">
            <span className="text-[11px] font-mono uppercase text-slate-400 mr-1">Pessoa:</span>
            <Ch active={personFilter === "ALL"} onClick={() => setPersonFilter("ALL")}>Todas</Ch>
            {peopleList.map(p => (
              <Ch key={p.person} active={personFilter === p.person} onClick={() => setPersonFilter(p.person)}>
                👤 {p.person} ({p.roles.map(r => r.role).join(", ")})
              </Ch>
            ))}
          </div>
        )}

        <div className="flex flex-wrap items-center gap-1.5">
          <span className="text-[11px] font-mono uppercase text-slate-400 mr-1">Fase:</span>
          <Ch active={phaseFilter === "ALL"} onClick={() => setPhaseFilter("ALL")}>Todas (F1–F8)</Ch>
          {PHASES_SPEC.filter(p => p.code !== "SLEEP").map(p => (
            <Ch key={p.code} active={phaseFilter === p.code} onClick={() => setPhaseFilter(p.code)}>{p.code}</Ch>
          ))}
        </div>
      </div>

      {roleFilter === "MINE" && !repo.me && !mePerson && <p className="text-xs text-amber-300">Selecione “Quem sou eu?” na barra superior para filtrar suas tarefas.</p>}

      <div className="text-[11px] text-slate-400 font-mono">💡 Dica: Arraste e solte qualquer cartão entre as colunas, ou clique em <b>⤢ Expandir</b> para ler/editar os detalhes sem aperto.</div>

      {/* KANBAN COM COLUNAS LARGAS E SCROLL HORIZONTAL CONFORTÁVEL + DRAG & DROP */}
      <div className="flex gap-3 overflow-x-auto pb-4 items-start">
        {TS.slice(0, 6).map(k => {
          const col = list.filter(t => t.status === k);
          const isOver = dragOverCol === k;
          return (
            <div
              key={k}
              onDragOver={e => { e.preventDefault(); if (dragOverCol !== k) setDragOverCol(k); }}
              onDragLeave={() => setDragOverCol(null)}
              onDrop={e => handleDrop(e, k)}
              className={`min-w-[275px] w-[275px] 2xl:flex-1 2xl:min-w-[240px] shrink-0 rounded-2xl p-3 border transition min-h-[260px] ${isOver ? "bg-cyan-950/30 border-cyan-400 ring-2 ring-cyan-400/50" : "bg-slate-900/50 border-slate-800"}`}
            >
              <div className="flex items-center gap-2 mb-3 pb-2 border-b border-slate-800/80">
                <span className={`w-2.5 h-2.5 rounded-full ${TD[k]}`} />
                <span className="text-xs font-bold uppercase tracking-wide text-slate-200">{TL[k]}</span>
                <div className="ml-auto flex items-center gap-1.5">
                  <button
                    title="Adicionar tarefa diretamente nesta coluna"
                    onClick={() => startAddInCol(k)}
                    className="w-5 h-5 flex items-center justify-center rounded bg-slate-800 hover:bg-cyan-500/20 text-cyan-300 hover:border-cyan-400 border border-slate-700 text-xs font-bold transition"
                  >
                    +
                  </button>
                  <span className="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-cyan-300">{col.length}</span>
                </div>
              </div>
              <div className="space-y-2.5">
                {!col.length && (
                  <div className={`text-xs text-center py-8 rounded-xl border border-dashed ${isOver ? "border-cyan-400 text-cyan-300" : "border-slate-800 text-slate-600"}`}>
                    {isOver ? "Solte aqui" : "Arraste tarefas para cá"}
                  </div>
                )}
                {col.map(t => <TaskCard key={t.id} t={t} s={s} now={now} onExpand={setExpandedId} />)}
              </div>
            </div>
          );
        })}
      </div>

      {list.some(t => t.status === "CANCELED") && (
        <>
          <button onClick={() => setCn(!cn)} className="text-xs text-slate-500 underline">
            {cn ? "ocultar" : "ver"} canceladas ({list.filter(t => t.status === "CANCELED").length})
          </button>
          {cn && (
            <div className="flex gap-3 overflow-x-auto pb-3">
              {list.filter(t => t.status === "CANCELED").map(t => (
                <div key={t.id} className="min-w-[275px] w-[275px] shrink-0">
                  <TaskCard t={t} s={s} now={now} onExpand={setExpandedId} />
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {expandedTask && <TaskModal t={expandedTask} s={s} now={now} onClose={() => setExpandedId(null)} />}
    </div>
  );
}

/* ============ ABA 3: TEAM (CARGOS COM MÚLTIPLAS PESSOAS & MAPA MULTI-CARGO) ============ */
function Team({ s }) {
  const [drafts, setDrafts] = useState({});
  const peopleMap = allPeople(s);

  const addAssignee = m => {
    const raw = (drafts[m.id] || "").trim();
    if (!raw) return;
    const names = raw.split(",").map(x => x.trim()).filter(Boolean);
    const current = Array.isArray(m.assignees) ? m.assignees : [];
    const merged = Array.from(new Set([...current, ...names]));
    repo.updateMember(m.id, { assignees: merged });
    setDrafts({ ...drafts, [m.id]: "" });
  };

  const removeAssignee = (m, name) => {
    const current = Array.isArray(m.assignees) ? m.assignees : [];
    repo.updateMember(m.id, { assignees: current.filter(x => x !== name) });
  };

  return (
    <div className="space-y-4">
      <Card className="p-4 bg-slate-900/90 border-cyan-500/30">
        <H right={<span className="mono text-xs text-cyan-300">{peopleMap.length} pessoa(s) alocada(s)</span>}>
          Mapa de Alocação Multi-Cargo (Várias Pessoas por Cargo · Vários Cargos por Pessoa)
        </H>
        <p className="text-xs text-slate-400 mb-3">
          Adicione os nomes em cada frente abaixo (ex.: <code>Kaio, Renan, Felipe</code> em <code>DADOS-1</code>, ou <code>Rian</code> em <code>COORD</code>, <code>DADOS-2</code> e <code>NARR</code>). O painel cruza automaticamente quem está em quais frentes:
        </p>
        {peopleMap.length === 0 ? (
          <div className="text-xs text-amber-300 bg-amber-950/30 border border-amber-500/30 rounded-xl p-2.5">
            Nenhuma pessoa nominal cadastrada ainda. Digite os nomes da equipe nos cards abaixo!
          </div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {peopleMap.map(({ person, roles }) => {
              const pTasks = s.tasks.filter(t => roles.some(r => r.id === t.ownerId) && t.status !== "CANCELED");
              const pDone = pTasks.filter(t => t.status === "DONE").length;
              return (
                <div key={person} className="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 flex items-center justify-between gap-2">
                  <div>
                    <div className="text-sm font-bold text-white">👤 {person}</div>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {roles.map(r => <Chip key={r.id} c="border-cyan-500/40 text-cyan-300 font-mono">{r.role}</Chip>)}
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="mono text-xs font-bold text-emerald-300">{pct(pTasks)}%</div>
                    <div className="text-[10px] text-slate-500">{pDone}/{pTasks.length} tarefas</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3.5">
        {s.members.map(m => {
          const meta = ROLE_META[m.role] || ROLE_META["COORD"];
          const mTasks = s.tasks.filter(t => t.ownerId === m.id && t.status !== "CANCELED");
          const mDone = mTasks.filter(t => t.status === "DONE").length;
          const mPct = pct(mTasks);
          const assignees = Array.isArray(m.assignees) ? m.assignees : [];

          return (
            <Card key={m.id} className={m.id === repo.me ? "border-cyan-400" : ""}>
              <div className="flex items-center justify-between gap-2 mb-1">
                <div className="flex items-center gap-2">
                  <span className={`w-3 h-3 rounded-full shrink-0 ${MS[m.status][2]}`} />
                  <span className="text-base font-bold text-white font-mono">{m.role}</span>
                </div>
                <Chip c="border-amber-500/40 text-amber-300 font-mono">Backup: {m.backup || meta.backup}</Chip>
              </div>
              <div className="text-xs font-semibold text-cyan-300">{meta.title}</div>

              {/* PESSOAS ALOCADAS NESTE CARGO */}
              <div className="mt-2.5 p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 space-y-2">
                <div className="text-[10px] font-mono uppercase tracking-wider text-slate-400">Pessoas neste cargo ({assignees.length})</div>
                <div className="flex flex-wrap gap-1.5">
                  {assignees.length === 0 && <span className="text-[11px] text-slate-500">Ninguém alocado ainda</span>}
                  {assignees.map(person => (
                    <span key={person} className="inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full bg-cyan-500/15 border border-cyan-400/40 text-cyan-200">
                      {person}
                      <button onClick={() => removeAssignee(m, person)} className="text-cyan-400 hover:text-rose-400 font-bold leading-none" title="Remover pessoa">×</button>
                    </span>
                  ))}
                </div>
                <div className="flex gap-1.5">
                  <input
                    className={`${inp} text-xs py-1`}
                    placeholder="+ Nome (ou Kaio, Renan, Felipe)"
                    value={drafts[m.id] || ""}
                    onChange={e => setDrafts({ ...drafts, [m.id]: e.target.value })}
                    onKeyDown={e => e.key === "Enter" && addAssignee(m)}
                  />
                  <button onClick={() => addAssignee(m)} className="px-2.5 py-1 rounded-lg bg-cyan-400 text-slate-950 font-bold text-xs shrink-0">+</button>
                </div>
              </div>

              <div className="text-[11px] text-slate-400 mt-2 leading-relaxed">
                <b className="text-slate-300">Módulos Exclusivos:</b> {m.modules || meta.modules}
              </div>

              <div className="flex items-center justify-between text-[11px] mt-2 mb-1">
                <span className="text-slate-400">Progresso do cargo</span>
                <span className="mono text-emerald-300">{mDone}/{mTasks.length} entregas ({mPct}%)</span>
              </div>
              <div className="mb-2.5"><Bar p={mPct} c="bg-emerald-400" /></div>

              <div className="grid grid-cols-4 gap-1 mb-2">
                {Object.entries(MS).map(([k, v]) => (
                  <button
                    key={k}
                    onClick={() => repo.updateMember(m.id, { status: k })}
                    className={`text-[11px] leading-tight py-2 rounded-md font-medium ${m.status === k ? v[1] : "bg-slate-800 text-slate-400"}`}
                  >
                    {v[0]}
                  </button>
                ))}
              </div>
              <Sel
                v={m.currentTaskId}
                on={v => repo.updateMember(m.id, { currentTaskId: v })}

            </Card>
          );
        })}
      </div>
    </div>
  );
}
