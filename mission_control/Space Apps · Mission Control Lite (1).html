:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

::-webkit-scrollbar{width:6px;height:6px}

@keyframes ignitionFlash{
  0%{opacity:0;transform:scale(0.92)}

}

  { n: 2, danger: false, title: "Seasonal Isolation (Henrietta Leavitt Principle)", desc: "Forbidden to regress raw monthly series contaminated by summer/winter cycles. Extract Monthly Climatological Anomaly first (Y'_{a,m} = Y_{a,m} − Ȳ_m) and enforce the exact same window [t_0, t_f] across regions." },
  { n: 3, danger: true, title: "FORBIDDEN: % on Interval Scales", desc: "Zero percentage (%) for variables without a true absolute zero (Temperature in °C or GRACE Water Anomalies in cm). Display differences only (±X °C/decade). % only on pure ratio scales (km², mm)." },
  { n: 4, danger: false, title: "Distinction Between Slope (B) and Correlation (r / τ)", desc: "Regression (B) tells how much Y changes per unit X; correlation (Pearson's r, Kendall's τ) tells how tight the contour ellipse is (predictability). Display both!" },
  { n: 5, danger: false, title: "Multiscale Correlation Decomposition", desc: "When comparing 2 regions, measure both long-term secular correlation (r_global) and short-term detrended residual correlation (r_detrended) to capture dipoles like El Niño." },
  { n: 6, danger: false, title: "Nonlinear Modeling with GAM/Splines", desc: "Never use unconstrained high-degree polynomials. Pair the trend line with a smooth curve (GAM / Smoothing Spline) to reveal acceleration/saturation and diagnose 'bumps' (sensor vs. El Niño vs. ramp)." },
  { n: 7, danger: false, title: "Mahalanobis Outliers + AR(1) & FDR Significance", desc: "Highlight extremes outside the bivariate ellipse (Mahalanobis Distance D_M > 2.5) without deleting them; correct p-value for AR(1) serial autocorrelation (N_effective) and apply Benjamini-Hochberg (q_FDR < 0.05) across the map grid." }

  "DADOS-2": ["Rhyan", "Fred"],

    name: r,
    role: r,
    assignees: OFFICIAL_ASSIGNEES[r] || [],
    backup: ROLE_META[r].backup,
    modules: ROLE_META[r].modules,
    status: "AVAILABLE",
    currentTaskId: "",

  const T = (title, o, priority, dueMin, status, moscow, g, phase, notes = "") => ({

    ownerId: M[o],

      T("Define state flow '1st Variable → 2nd Where (Loc A/B + 1x1, 2x2, 3x3 Grid) → 3rd Time' in JSON Contract and start Frontend boilerplate", "PROD-1", "P0", 90, "READY", "MUST", 1, "F1", "Structure the user-flow payload (variable sets grid and start year; coordinates A and B with 1x1, 2x2, 3x3 blocks; interval [t0, tf]) and set up Frontend boilerplate."),

      /* Phase 2: NASA POWER Client (Adjacent Cells K<=9), Statistical Engine & Base 2D Map (Sat 10:30 - 12:30 | Gate 1 @ 210m) */
      T("Build NASA POWER client with adjacent-cell spatial aggregator (1 <= K <= 9, e.g., 1x1, 1x3, 2x1, 3x3) and Semaphore(3)", "DADOS-1", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Query /temporal/monthly/point (MERRA-2 0.5°×0.625° grid) with asyncio.Semaphore(3) (30 req/min limit), drop YYYY13, convert -999 -> np.nan + nanmean() and PRECTOTCORR mm/day -> mm/month."),

      T("Code in stats_engine.py: GAM Curve, Mahalanobis Outliers (D_M > 2.5), and AR(1)+FDR test (Real Trend vs Noise)", "DADOS-2", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Implement smoothed fit (GAM/spline) for acceleration/saturation, bivariate Mahalanobis Distance (D_M > 2.5), and significance test with AR(1)-corrected p-value and Benjamini-Hochberg FDR."),
      T("Build <MapView /> component in Leaflet (Canvas) and selectors (1 var/area in MVP + free K <= 9 composition) reading Mock", "PROD-1", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Render <MapView /> in Leaflet Canvas consuming gridGeometry.ts (snap + 8-neighbors K<=9 already ready on frontend branch), drawing L.rectangle for Location A and Location B and time controls."),
      T("Build Scientific Chart Workbench shell (overlaid/split curves, Raw vs Anomaly, OLS/Sen lines) reading Mock", "PROD-2", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Render timeline consuming mock_analysis.json: instant toggle between raw series and deseasonalized anomaly, OLS/Sen trend lines, overlaid/split mode, and Dual Y-Axis."),

      T("Publish 1st working deploy (with Mock JSON) to public URL before 12:30", "COORD", "P0", 210, "BACKLOG", "MUST", 2, "F2", "Deploy build to public environment (Vercel/GitHub Pages) consuming mock_analysis.json, verify zero console errors, and validate < 2s load time."),

      T("Certify temporal alignment and date clipping for MERRA-2 and CERES variables", "DADOS-1", "P0", 390, "BACKLOG", "MUST", 3, "F3", "Guarantee clean date intersection (1984–present when crossing with CERES, or 1981–present for MERRA-2) without generating NaNs in paired series."),
      T("Implement cross-correlation and bivariate scatter (X vs Y) with contour ellipse", "DADOS-2", "P0", 390, "BACKLOG", "MUST", 3, "F3", "Compute Pearson (r) and Kendall (tau) correlation between series A/X and series B/Y, both global and deseasonalized residual (r_detrended), generating Mahalanobis ellipse coordinates."),
      T("Add selection controls for Location A and Location B on the 2D Map (or A=B)", "PROD-1", "P0", 410, "BACKLOG", "MUST", 3, "F3", "Allow marking Point A (e.g., blue marker) and Point B (e.g., orange marker) on the map, with 'Same Location (A=B)' toggle for cross-variable correlation at one site."),
      T("Build scientific diagnosis cards for the 4 Answers (What, Where, How Much, Significance)", "PROD-2", "P0", 410, "BACKLOG", "MUST", 3, "F3", "Display in real time: 1) Variable name and anomaly; 2) Coordinates and selected grid; 3) Decadal rate (B_Sen / B_OLS) with no % on °C; 4) AR(1) p-value and FDR significance."),
      T("Write in-app scientific glossary explaining climate statistics terms", "NARR", "P1", 420, "BACKLOG", "SHOULD", 3, "F3", "Write accessible tooltips and explanations for OLS, Theil-Sen, GAM, Mahalanobis, and AR(1), guiding users and NASA judges."),

      /* Phase 4: Full Scientific Workbench & Co-Pilot Chatbot (Sat 16:00 - 21:30 | Checkpoint @ 750m) */
      T("Finalize workbench with Dual Y-Axis, Z-Score (σ), log/symlog scale, and visual layers", "PROD-2", "P0", 720, "BACKLOG", "MUST", 4, "F4", "Implement buttons to: toggle independent Dual Y-Axis, normalize by Z-Score (mean 0, std 1), toggle logarithmic scale, and toggle OLS line, GAM curve, and Mahalanobis points layers."),
      T("Define architecture and prompt for the Statistical Co-Pilot Chatbot for interpretation", "DADOS-2", "P0", 720, "BACKLOG", "MUST", 4, "F4", "Design Co-Pilot Chatbot engine (fast LLM API or heuristic statistical synthesis generator with fallback): receives series JSON and outputs immediate textual diagnosis in Portuguese/English."),
      T("Build interactive Co-Pilot Chatbot side panel in the UI", "PROD-2", "P0", 730, "BACKLOG", "MUST", 4, "F4", "Create expandable Chatbot drawer/card with conversation history, 'Analyze Current Scenario with Co-Pilot' button, and Markdown-formatted replies."),
      T("Synthesize Gemini Deep Research findings and propose 2 scientific discovery hypotheses", "NARR", "P0", 730, "BACKLOG", "MUST", 4, "F4", "Compile Deep Research report highlighting extreme anomalies or underexplored teleconnections between river basins and solar radiation to guide the ML model."),

function migrate(o) {
  const base = seed();
  if (!o || typeof o !== "object") return base;
  const stMap = { working: "WORKING", blocked: "BLOCKED", resting: "RESTING" };
  return {
    ...base,
    schema_version: "6.0",
    version: (o.version || 1) + 1,
    updatedAt: o.updatedAt || nowIso(),
    updatedBy: o.updatedBy || "migration",
    event: { start: (o.event && o.event.start) || base.event.start, minutes: (o.event && o.event.minutes) || 2340 },
    focus: o.focus || (o.mvp && o.mvp.sentence) || base.focus,
    members: Array.isArray(o.members) && o.members.length === 6 ? o.members.map(m => {
      const r = m.role || m.name || "COORD";
      const meta = ROLE_META[r] || ROLE_META["COORD"];
      const baseAssignees = OFFICIAL_ASSIGNEES[r] || [];
      const hasAssignees = Array.isArray(m.assignees) && m.assignees.length > 0;
      return {
        id: m.id || uid(),
        name: m.name || r,
        role: r,
        assignees: hasAssignees ? m.assignees : baseAssignees,
        backup: m.backup || meta.backup,
        modules: m.modules || meta.modules,
        status: MS[m.status] ? m.status : (stMap[m.status] || "AVAILABLE"),
        currentTaskId: m.currentTaskId || "",
        notes: m.notes || ""
      };
    }) : base.members,
    gates: Array.isArray(o.gates) && o.gates.length >= 5 ? o.gates.map((g, idx) => ({
      id: g.id || uid(),
      n: g.n || (idx + 1),
      title: g.title,
      offset: typeof g.offset === "number" ? g.offset : (base.gates[idx] ? base.gates[idx].offset : 90),
      rule: g.rule || (base.gates[idx] ? base.gates[idx].rule : ""),
      status: ["pending", "passed", "failed"].includes(g.status) ? g.status : "pending"
    })) : base.gates,
    tasks: Array.isArray(o.tasks) && o.tasks.length ? o.tasks.map(t => ({
      id: t.id || uid(),
      title: t.title || "Task",
      notes: t.notes || "",
      ownerId: t.ownerId || "",
      priority: PR[t.priority] ? t.priority : "P1",
      due: t.due || "",
      status: TS.includes(t.status) ? t.status : "BACKLOG",
      blockedReason: t.blockedReason || "",
      moscow: MO.includes(t.moscow || "") ? (t.moscow || "") : (t.priority === "P0" ? "MUST" : ""),
      gateId: t.gateId || "",
      phase: t.phase || "F1"
    })) : base.tasks,
    risks: Array.isArray(o.risks) && o.risks.length ? o.risks.map((r, idx) => ({
      id: r.id || uid(),
      code: r.code || `R${idx + 1}`,
      problem: r.problem || r.title || "",
      ownerId: r.ownerId || "",
      plan: r.plan || r.planB || r.mitigation || "",
      state: ["OPEN", "CLOSED"].includes(r.state) ? r.state : (r.status === "aberto" ? "OPEN" : "CLOSED")
    })) : base.risks,
    delivery: Array.isArray(o.delivery) && o.delivery.length ? o.delivery : base.delivery,
    scienceAudit: Array.isArray(o.scienceAudit) && o.scienceAudit.length ? o.scienceAudit : base.scienceAudit
  };
}

const IDR = /^[\w-]{6,}$/;
function validate(s) {
  const e = m => ({ ok: false, err: m });
  if (!s || typeof s !== "object") return e("Invalid state");
  for (const k of ["members", "tasks", "gates", "risks", "delivery"]) if (!Array.isArray(s[k])) return e("Missing field: " + k);
  if (!s.event || isNaN(new Date(s.event.start)) || typeof s.event.minutes !== "number") return e("Invalid event data");
  if (s.gates.length < 5) return e("At least 5 gates are required");
  const mid = new Set(s.members.map(m => m.id)), gid = new Set(s.gates.map(g => g.id));
  for (const m of s.members) if (!IDR.test(m.id) || !MS[m.status]) return e("Invalid member");
  for (const g of s.gates) if (!IDR.test(g.id) || !["pending", "passed", "failed"].includes(g.status) || typeof g.offset !== "number") return e("Invalid gate");
  for (const t of s.tasks) {
    if (!IDR.test(t.id) || typeof t.title !== "string" || !TS.includes(t.status) || !PR[t.priority] || !MO.includes(t.moscow || "")) return e("Invalid task: " + t.title);
    if (t.ownerId && !mid.has(t.ownerId)) return e("Unknown owner in: " + t.title);
    if (t.gateId && !gid.has(t.gateId)) return e("Unknown gate in: " + t.title);
    if (t.due && isNaN(new Date(t.due))) return e("Invalid deadline in: " + t.title);
  }
  for (const r of s.risks) if (!["OPEN", "CLOSED"].includes(r.state) || (r.ownerId && !mid.has(r.ownerId))) return e("Invalid risk");
  return { ok: true };
}

/* ============ REPOSITORY WITH LOCAL PERSISTENCE (mc-v6) & WI-FI LAN SYNC ============ */
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

class LocalRepository {
  constructor() {
    this.l = new Set();
    this.me = ls.get("mc-me") || "";
    this.lanUrl = "";
    this.lanStatus = "offline"; // "connected" | "connecting" | "offline"
    this.lanError = "";
    this.es = null;
    this.isSyncingRemote = false;
    this.s = this.load();
    this.initLan();
  }
  load() {
    try {
      const v6 = ls.get("mc-v6");
      if (v6) {
        const r = JSON.parse(v6);
        if (r && (r.schema_version === "6.0" || r.schema_version === "5.0") && validate(r).ok) {
          if (!Array.isArray(r.scienceAudit)) r.scienceAudit = seed().scienceAudit;
          if (Array.isArray(r.members)) {
            r.members.forEach(m => {
              if ((!Array.isArray(m.assignees) || m.assignees.length === 0) && OFFICIAL_ASSIGNEES[m.role]) {
                m.assignees = OFFICIAL_ASSIGNEES[m.role];
              }
            });
          }
          r.schema_version = "6.0";
          return r;
        }
      }
    } catch (e) {}

    const fresh = seed();
    try {
      const v5 = ls.get("mc-v5") || ls.get("mc-v4");
      if (v5) {
        const old = JSON.parse(v5);
        if (old) {
          if (old.event) fresh.event = old.event;
          if (Array.isArray(old.members)) {
            fresh.members.forEach(m => {
              const om = old.members.find(x => (x.role && x.role === m.role) || (x.name && x.name === m.role));
              if (om) {
                if (Array.isArray(om.assignees) && om.assignees.length) m.assignees = om.assignees;
                if (om.status) m.status = om.status;
                if (om.notes) m.notes = om.notes;
              }
            });
          }
        }
      }
    } catch (e) {}

    ls.set("mc-v6", JSON.stringify(fresh));
    return fresh;
  }
  getState() { return this.s; }
  subscribe(f) { this.l.add(f); return () => this.l.delete(f); }
  userName() { const m = this.s.members.find(x => x.id === this.me); return m ? m.name : "anonymous"; }
  setMe(id) { this.me = id; ls.set("mc-me", id); this.notify(); }
  notify() { this.l.forEach(f => f()); }

  initLan() {
    if (typeof window !== "undefined" && window.location && window.location.protocol.startsWith("http")) {
      this.connectLan(window.location.origin);
    } else {
      const saved = ls.get("mc-lan-url");
      if (saved) this.connectLan(saved);
    }
  }

  connectLan(url) {
    const targetUrl = (url || "").trim().replace(/\/+$/, "");
    if (!targetUrl) return;
    if (typeof window !== "undefined" && (!window.location || !window.location.protocol.startsWith("http") || targetUrl !== window.location.origin)) {
      ls.set("mc-lan-url", targetUrl);
    }
    this.lanUrl = targetUrl;
    this.lanStatus = "connecting";
    this.lanError = "";
    this.notify();

    if (this.es) {
      try { this.es.close(); } catch (_) {}
      this.es = null;
    }

    // 1. Fetch initial state from server
    fetch(targetUrl + "/api/state")
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(remote => {
        if (remote && remote.empty) {
          // Empty server: initialize with current local state
          this.pushToLan(this.s);
        } else if (remote && validate(remote).ok) {
          if (!this.s || (remote.version && remote.version > this.s.version) || remote.updatedAt !== this.s.updatedAt) {
            this.applyRemote(remote);
          }
        }
        this.startEventSource(targetUrl);
      })
      .catch(err => {
        console.warn("Warning connecting to LAN /api/state:", err);
        this.lanStatus = "offline";
        this.lanError = err.message || "Connection error";
        this.notify();
        this.startEventSource(targetUrl);
      });
  }

  startEventSource(url) {
    if (this.es) {
      try { this.es.close(); } catch (_) {}
      this.es = null;
    }
    try {
      const es = new EventSource(url + "/api/events");
      this.es = es;
      es.onopen = () => {
        this.lanStatus = "connected";
        this.lanError = "";
        this.notify();
      };
      es.onerror = () => {
        if (this.es === es) {
          this.lanStatus = "offline";
          this.notify();
        }
      };
      es.onmessage = e => {
        try {
          const remote = JSON.parse(e.data);
          if (remote && validate(remote).ok) {
            if (!this.s || (remote.version && remote.version > this.s.version) || remote.updatedAt !== this.s.updatedAt) {
              this.applyRemote(remote);
            }
          }
        } catch (err) {
          console.warn("Error decoding SSE event:", err);
        }
      };
    } catch (err) {
      this.lanStatus = "offline";
      this.lanError = err.message || "EventSource not supported";
      this.notify();
    }
  }

  disconnectLan() {
    if (this.es) {
      try { this.es.close(); } catch (_) {}
      this.es = null;
    }
    this.lanStatus = "offline";
    this.lanUrl = "";
    ls.set("mc-lan-url", "");
    this.notify();
  }

  applyRemote(remote) {
    this.isSyncingRemote = true;
    try {
      this.s = remote;
      ls.set("mc-v6", JSON.stringify(remote));
      this.notify();
    } finally {
      this.isSyncingRemote = false;
    }
  }

  pushToLan(state) {
    if (!this.lanUrl) return;
    fetch(this.lanUrl + "/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).catch(err => console.warn("Failed to push state to LAN:", err));
  }

  commit(fn) {
    const s = structuredClone(this.s);
    fn(s);
    s.version++;
    s.updatedAt = nowIso();
    s.updatedBy = this.userName();
    this.s = s;
    ls.set("mc-v6", JSON.stringify(s));
    this.notify();
    if (!this.isSyncingRemote) {
      this.pushToLan(s);
    }
  }
  addTask(t) { this.commit(s => { s.tasks.push(t); }); }
  updateTask(id, p) { this.commit(s => Object.assign(s.tasks.find(x => x.id === id), p)); }
  deleteTask(id) { this.commit(s => { s.tasks = s.tasks.filter(x => x.id !== id); s.members.forEach(m => { if (m.currentTaskId === id) m.currentTaskId = ""; }); }); }
  updateMember(id, p) { this.commit(s => Object.assign(s.members.find(x => x.id === id), p)); }
  updateGate(id, p) { this.commit(s => Object.assign(s.gates.find(x => x.id === id), p)); }
  addRisk(r) { this.commit(s => { s.risks.push(r); }); }
  updateRisk(id, p) { this.commit(s => Object.assign(s.risks.find(x => x.id === id), p)); }
  backup() { ls.set("mc-v6-backup", JSON.stringify(this.s)); }
  replace(state) { this.backup(); this.commit(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, structuredClone(state)); }); }
  restore() { try { const b = JSON.parse(ls.get("mc-v6-backup")); if (!validate(b).ok) return false; this.replace(b); return true; } catch (e) { return false; } }
}

const COLS = ["members", "tasks", "gates", "risks", "delivery", "scienceAudit"], META = ["id", "order", "updatedAt", "updatedBy"], sleep = ms => new Promise(r => setTimeout(r, ms));
const HAS = !!(window.claude && window.claude.use);
const bus = { impl: null, sh: null, fn: new Set(), status: HAS ? "connecting" : "local", lockMsg: HAS ? "Connecting to server… please wait" : "", say() {}, emit() { this.fn.forEach(f => f()); }, on(f) { this.fn.add(f); return () => this.fn.delete(f); } };

const local = new LocalRepository();
local.subscribe(() => bus.emit());
bus.impl = local;

const WR = new Set(["addTask", "updateTask", "deleteTask", "updateMember", "updateGate", "addRisk", "updateRisk", "commit", "replace", "restore", "connectLan", "disconnectLan"]);
const repo = new Proxy({}, {
  get(_, k) {
    if (k === "me") return ls.get("mc-me") || "";
    if (k === "setMe") return id => { ls.set("mc-me", id); local.me = id; if (bus.sh) bus.sh.me = id; bus.emit(); };
    if (k === "subscribe") return f => bus.on(f);
    if (k === "lanStatus") return local.lanStatus;
    if (k === "lanUrl") return local.lanUrl;
    if (k === "connectLan") return url => local.connectLan(url);
    if (k === "disconnectLan") return () => local.disconnectLan();
    const i = bus.impl, v = i[k];
    if (typeof v !== "function") return v;
    if (WR.has(k)) return (...a) => bus.lockMsg ? bus.say(bus.lockMsg) : v.apply(i, a);
    return v.bind(i);
  }
});
const useRepo = () => { const [, f] = useState(0); useEffect(() => repo.subscribe(() => f(x => x + 1)), []); return repo.getState(); };

/* ============ HELPERS TEMPORAIS E DE PROGRESSO ============ */
const T0 = s => new Date(s.event.start).getTime();
const Tend = s => T0(s) + (s.event.minutes || 2340) * 6e4;
const gAt = (s, g) => T0(s) + g.offset * 6e4;
const freezeOn = (s, now) => { const g = s.gates.find(x => x.n === 5) || s.gates.find(x => x.offset === 1680); return g ? (now >= gAt(s, g) || g.status === "passed") : false; };

/* Formatting with seconds for high-precision countdown timer */
const durSec = ms => {
  const totalSec = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, "0");
  return (d ? `${d}d ` : "") + `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
};
const dur = ms => {
  const m = Math.floor(Math.abs(ms) / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return (d ? d + "d " : "") + `${h}h ${String(m % 60).padStart(2, "0")}m`;
};
const fmtAt = ts => new Date(ts).toLocaleString("en-US", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const toLoc = iso => { if (!iso) return ""; const d = new Date(iso), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fromLoc = v => v ? new Date(v).toISOString() : "";
const memberLabel = m => {
  if (!m) return "—";
  const list = Array.isArray(m.assignees) && m.assignees.length ? m.assignees : (m.name && m.name !== m.role ? [m.name] : []);
  return list.length ? `${m.role || m.name} (${list.join(", ")})` : (m.role || m.name);
};
const nm = (s, id) => {
  const m = s.members.find(x => x.id === id);
  if (!m) return "—";
  const list = Array.isArray(m.assignees) && m.assignees.length ? m.assignees : (m.name && m.name !== m.role ? [m.name] : []);
  return list.length ? `${m.role} · ${list.join(", ")}` : m.name;
};
const mOpts = (s, ph = "—") => [["", ph], ...s.members.map(m => [m.id, memberLabel(m)])];
const allPeople = s => {
  const map = new Map();
  s.members.forEach(m => {
    const list = Array.isArray(m.assignees) && m.assignees.length ? m.assignees : (m.name && m.name !== m.role ? [m.name] : []);
    list.forEach(p => {
      const k = p.trim();
      if (!k) return;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(m);
    });
  });
  return Array.from(map.entries()).map(([person, roles]) => ({ person, roles }));
};
const late = (t, now) => OPEN(t) && t.due && new Date(t.due).getTime() < now;
const pct = a => a.length ? Math.round(a.filter(t => t.status === "DONE").length / a.length * 100) : 0;

/* Identify Current Phase based on elapsed minutes since T0 */
function currentPhaseInfo(s, now) {
  const elapsedMin = (now - T0(s)) / 6e4;
  if (elapsedMin < 0) return { state: "PRE", elapsedMin, phase: PHASES_SPEC[0], label: "Pre-Kickoff (Awaiting Launch Sat 09:00)" };
  if (elapsedMin >= 2340) return { state: "POST", elapsedMin, phase: PHASES_SPEC[PHASES_SPEC.length - 1], label: "Hackathon Ended (Sun 24:00 Deadline Reached)" };
  if (elapsedMin >= 2250) return { state: "BUFFER", elapsedMin, phase: PHASES_SPEC[PHASES_SPEC.length - 1], label: "Exclusive Contingency Buffer (Sun 22:30 – 24:00)" };
  if (elapsedMin >= 1680 && elapsedMin < 1710) return { state: "LUNCH", elapsedMin, phase: PHASES_SPEC[6], label: "Lunch & Silent Recording Setup (Sun 13:00 – 13:30)" };
  const found = PHASES_SPEC.find(p => elapsedMin >= p.startMin && elapsedMin < p.endMin) || PHASES_SPEC[0];
  return { state: "ACTIVE", elapsedMin, phase: found, label: found.title };
}

}

function Tasks({ s, now, say, initPhase, clearInitPhase, mePerson }) {
  const [n, setN] = useState({
    title: "",
    ownerId: "",
    priority: "P0",
    moscow: "MUST",
    phase: "F1",
    status: "READY",
    due: "",
    notes: ""
  });
  const [showNotes, setShowNotes] = useState(false);
  const titleInputRef = useRef(null);
  const [roleFilter, setRoleFilter] = useState("ALL");
  const [personFilter, setPersonFilter] = useState("ALL");
  const [phaseFilter, setPhaseFilter] = useState(initPhase || "ALL");
  const [ok, setOk] = useState(false);
  const [cn, setCn] = useState(false);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  useEffect(() => {
    if (initPhase) {
      setPhaseFilter(initPhase);
      clearInitPhase();
    }
  }, [initPhase]);

  const frz = freezeOn(s, now);
  const add = () => {
    if (!n.title.trim()) return;
    if (frz && !ok) return say("🔒 Feature Freeze active: confirm this is a bugfix/doc/integration");
    repo.addTask({
      id: uid(),
      title: n.title.trim(),
      notes: n.notes ? n.notes.trim() : "",
      ownerId: n.ownerId || repo.me || "",
      priority: n.priority,
      due: n.due,
      status: n.status || "READY",
      blockedReason: n.status === "BLOCKED" ? "Blocked on creation" : "",
      moscow: n.moscow || "MUST",
      gateId: "",
      phase: n.phase || "F1"
    });
    say(`Task created in ${TL[n.status || "READY"]}!`);
    setN(prev => ({ ...prev, title: "", notes: "", due: "" }));
    setShowNotes(false);
    setOk(false);
  };

  const startAddInCol = colKey => {
    setN(prev => ({ ...prev, status: colKey }));
    if (titleInputRef.current) {
      titleInputRef.current.focus();
      titleInputRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  };

  const peopleList = allPeople(s);

  const list = s.tasks.filter(t => {
    const owner = s.members.find(x => x.id === t.ownerId);
    if (roleFilter === "MINE") {
      if (mePerson) {
        if (!owner || !Array.isArray(owner.assignees) || !owner.assignees.includes(mePerson)) return false;
      } else if (t.ownerId !== repo.me) return false;
    }
    if (roleFilter === "P0" && t.priority !== "P0") return false;
    if (roleFilter !== "ALL" && roleFilter !== "MINE" && roleFilter !== "P0") {
      if (!owner || owner.role !== roleFilter) return false;
    }
    if (personFilter !== "ALL") {
      if (!owner || !Array.isArray(owner.assignees) || !owner.assignees.includes(personFilter)) return false;
    }
    if (phaseFilter !== "ALL" && (t.phase || "F1") !== phaseFilter) return false;
    return true;
  });

  const activeList = list.filter(t => t.status !== "CANCELED");
  const expandedTask = expandedId ? s.tasks.find(x => x.id === expandedId) : null;

  const Ch = ({ active, onClick, children }) => (
    <button onClick={onClick} className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${active ? "bg-cyan-400 text-slate-950 border-cyan-400 font-semibold" : "bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-500"}`}>
      {children}
    </button>
  );

  const handleDrop = (e, targetStatus) => {
    e.preventDefault();
    setDragOverCol(null);
    const taskId = e.dataTransfer.getData("text/plain");
    if (!taskId) return;
    const task = s.tasks.find(x => x.id === taskId);
    if (!task || task.status === targetStatus) return;
    repo.updateTask(taskId, {
      status: targetStatus,
      blockedReason: targetStatus === "BLOCKED" ? task.blockedReason : ""
    });
    say(`Moved to ${TL[targetStatus]}`);
  };

  return (
    <div className="space-y-3">
      {frz && <FreezeBanner />}

      {/* FILTERED TASKS PROGRESS BAR */}
      <Card className="p-3">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-1.5">
          <span className="text-xs font-semibold text-cyan-300 uppercase tracking-wider">Current Filter Progress ({activeList.filter(t => t.status === "DONE").length}/{activeList.length} completed)</span>
          <span className="mono text-sm font-bold text-emerald-300">{pct(activeList)}%</span>
        </div>
        <Bar p={pct(activeList)} c="bg-emerald-400" />
      </Card>

      {/* CREATE NEW FULL & QUICK TASK */}
      <Card className="border-slate-800 bg-slate-900/90 space-y-2.5">
        <div className="flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <span className="text-xs font-semibold text-cyan-300 uppercase tracking-wider font-mono">+ Create Kanban Task</span>
            <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full border ${n.status === "READY" ? "bg-sky-950/60 text-sky-300 border-sky-500/40" : n.status === "BACKLOG" ? "bg-slate-800 text-slate-300 border-slate-700" : n.status === "IN_PROGRESS" ? "bg-cyan-950/60 text-cyan-300 border-cyan-500/40" : "bg-amber-950/60 text-amber-300 border-amber-500/40"}`}>
              Column: {TL[n.status || "READY"]}
            </span>
          </div>
          <button
            type="button"
            onClick={() => setShowNotes(!showNotes)}
            className={`text-xs font-mono px-2.5 py-1 rounded-lg border transition ${showNotes ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" : "bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200"}`}
          >
            {showNotes ? "▲ Hide Description" : "📝 + Description / Notes"}
          </button>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2">
          {/* Task title */}
          <div className="sm:col-span-2 lg:col-span-4">
            <input
              ref={titleInputRef}
              className={inp}
              placeholder="Task or deliverable title…"
              value={n.title}
              onChange={e => setN({ ...n, title: e.target.value })}
              onKeyDown={e => e.key === "Enter" && add()}
            />
          </div>

          {/* Initial Column / Status */}
          <div className="lg:col-span-2">
            <Sel
              v={n.status || "READY"}

/* ============ TAB 3: TEAM (ROLES WITH MULTIPLE PEOPLE & MULTI-ROLE MAP) ============ */
function Team({ s }) {
  const [drafts, setDrafts] = useState({});
  const peopleMap = allPeople(s);

  const addAssignee = m => {
    const raw = (drafts[m.id] || "").trim();
    if (!raw) return;
    const names = raw.split(",").map(x => x.trim()).filter(Boolean);
    const current = Array.isArray(m.assignees) ? m.assignees : [];
    const merged = Array.from(new Set([...current, ...names]));
    repo.updateMember(m.id, { assignees: merged });
    setDrafts({ ...drafts, [m.id]: "" });
  };

  const removeAssignee = (m, name) => {
    const current = Array.isArray(m.assignees) ? m.assignees : [];
    repo.updateMember(m.id, { assignees: current.filter(x => x !== name) });
  };

  return (
    <div className="space-y-4">
      <Card className="p-4 bg-slate-900/90 border-cyan-500/30">
        <H right={<span className="mono text-xs text-cyan-300">{peopleMap.length} person(s) assigned</span>}>
          Multi-Role Allocation Map (Multiple People per Role · Multiple Roles per Person)
        </H>
        <p className="text-xs text-slate-400 mb-3">
          Add names to each track below (e.g., <code>Kaio, Renan, Felipe</code> in <code>DADOS-1</code>, or <code>Rian</code> in <code>COORD</code>, <code>DADOS-2</code>, and <code>NARR</code>). The panel automatically cross-references who is on which tracks:
        </p>
        {peopleMap.length === 0 ? (
          <div className="text-xs text-amber-300 bg-amber-950/30 border border-amber-500/30 rounded-xl p-2.5">
            No named people registered yet. Type team member names in the cards below!
          </div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {peopleMap.map(({ person, roles }) => {
              const pTasks = s.tasks.filter(t => roles.some(r => r.id === t.ownerId) && t.status !== "CANCELED");
              const pDone = pTasks.filter(t => t.status === "DONE").length;
              return (
                <div key={person} className="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 flex items-center justify-between gap-2">
                  <div>
                    <div className="text-sm font-bold text-white">👤 {person}</div>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {roles.map(r => <Chip key={r.id} c="border-cyan-500/40 text-cyan-300 font-mono">{r.role}</Chip>)}
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="mono text-xs font-bold text-emerald-300">{pct(pTasks)}%</div>
                    <div className="text-[10px] text-slate-500">{pDone}/{pTasks.length} tasks</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3.5">
        {s.members.map(m => {
          const meta = ROLE_META[m.role] || ROLE_META["COORD"];
          const mTasks = s.tasks.filter(t => t.ownerId === m.id && t.status !== "CANCELED");
          const mDone = mTasks.filter(t => t.status === "DONE").length;
          const mPct = pct(mTasks);
          const assignees = Array.isArray(m.assignees) ? m.assignees : [];

          return (
            <Card key={m.id} className={m.id === repo.me ? "border-cyan-400" : ""}>
              <div className="flex items-center justify-between gap-2 mb-1">
                <div className="flex items-center gap-2">
                  <span className={`w-3 h-3 rounded-full shrink-0 ${MS[m.status][2]}`} />
                  <span className="text-base font-bold text-white font-mono">{m.role}</span>
                </div>
                <Chip c="border-amber-500/40 text-amber-300 font-mono">Backup: {m.backup || meta.backup}</Chip>
              </div>
              <div className="text-xs font-semibold text-cyan-300">{meta.title}</div>

              {/* PEOPLE ASSIGNED TO THIS ROLE */}
              <div className="mt-2.5 p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 space-y-2">
                <div className="text-[10px] font-mono uppercase tracking-wider text-slate-400">People in this role ({assignees.length})</div>
                <div className="flex flex-wrap gap-1.5">
                  {assignees.length === 0 && <span className="text-[11px] text-slate-500">Nobody assigned yet</span>}
                  {assignees.map(person => (
                    <span key={person} className="inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full bg-cyan-500/15 border border-cyan-400/40 text-cyan-200">
                      {person}
                      <button onClick={() => removeAssignee(m, person)} className="text-cyan-400 hover:text-rose-400 font-bold leading-none" title="Remove person">×</button>
                    </span>
                  ))}
                </div>
                <div className="flex gap-1.5">
                  <input
                    className={`${inp} text-xs py-1`}
                    placeholder="+ Name (or Kaio, Renan, Felipe)"
                    value={drafts[m.id] || ""}
                    onChange={e => setDrafts({ ...drafts, [m.id]: e.target.value })}
                    onKeyDown={e => e.key === "Enter" && addAssignee(m)}
                  />
                  <button onClick={() => addAssignee(m)} className="px-2.5 py-1 rounded-lg bg-cyan-400 text-slate-950 font-bold text-xs shrink-0">+</button>
                </div>
              </div>

              <div className="text-[11px] text-slate-400 mt-2 leading-relaxed">
                <b className="text-slate-300">Exclusive Modules:</b> {m.modules || meta.modules}
              </div>

              <div className="flex items-center justify-between text-[11px] mt-2 mb-1">
                <span className="text-slate-400">Role progress</span>
                <span className="mono text-emerald-300">{mDone}/{mTasks.length} deliverables ({mPct}%)</span>
              </div>
              <div className="mb-2.5"><Bar p={mPct} c="bg-emerald-400" /></div>

              <div className="grid grid-cols-4 gap-1 mb-2">
                {Object.entries(MS).map(([k, v]) => (
                  <button
                    key={k}
                    onClick={() => repo.updateMember(m.id, { status: k })}
                    className={`text-[11px] leading-tight py-2 rounded-md font-medium ${m.status === k ? v[1] : "bg-slate-800 text-slate-400"}`}
                  >
                    {v[0]}
                  </button>
                ))}
              </div>
              <Sel
                v={m.currentTaskId}
                on={v => repo.updateMember(m.id, { currentTaskId: v })}
                o={[["", "Focus task: automatic"], ...s.tasks.filter(t => t.ownerId === m.id && OPEN(t)).map(t => [t.id, `[${t.phase}] ${t.title.slice(0, 42)}`])]}
                c="mb-2 text-xs"
              />
              <Tx v={m.notes} on={v => repo.updateMember(m.id, { notes: v })} placeholder={m.status === "BLOCKED" ? "What is the blocker? Notify " + (m.backup || meta.backup) : "Short status / branch…"} />
            </Card>
          );
        })}
      </div>
    </div>
  );
}

      say("JSON state copied! Paste in the team chat");

      const ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      ta.remove();
      say(ok ? "JSON state copied! Paste in the chat" : "Copy failed");

  };
  const prepare = txt => {
    try {
      const j = JSON.parse(txt);
      if (j.app !== undefined && j.app !== s.app) return say("File belongs to another application");
      let st = j.state || j;
      const v = st.schema_version || j.schema_version;
      if (v === "2.0" || v === "3.0" || v === "4.0" || v === "5.0") st = migrate(st);

    } catch (e) {
      say("Invalid JSON");
    }
  };

    try { prepare(await navigator.clipboard.readText()); } catch (e) { say("Paste blocked by browser: use the Import file button"); }

        </span>
        <div className="ml-auto flex items-center gap-1.5 flex-wrap">
          {/* Wi-Fi Network Button/Indicator */}
          {repo.lanStatus === "connected" ? (
            <button
              onClick={() => { setLanInputUrl(repo.lanUrl || ""); setShowLanModal(true); }}
              title={`🟢 Live on Network (${repo.lanUrl}) · Click for details or to disconnect`}
              className={`${btn} bg-emerald-500/20 text-emerald-300 border border-emerald-500/50 hover:bg-emerald-500/30`}
            >
              <span className="relative flex h-2 w-2 mr-1">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </span>
              <span className="hidden sm:inline">Live on Network</span>
              <span className="sm:hidden">LAN</span>
            </button>
          ) : (
            <button
              onClick={() => { setLanInputUrl(repo.lanUrl || "http://localhost:8765"); setShowLanModal(true); }}
              title="Connect real-time sync on Wi-Fi network (LAN)"
              className={`${btn} bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700`}
            >
              <span className="mr-1">📡</span>
              <span className="hidden sm:inline">Wi-Fi LAN</span>
              <span className="sm:hidden">LAN</span>
            </button>
          )}

          <button onClick={copyState} title="Copy JSON state to clipboard" className={`${btn} bg-emerald-500 hover:bg-emerald-400 text-slate-950`}><Ic d={IO.copy} c="w-4 h-4" /><span className="hidden sm:inline">Copy</span></button>
          <button onClick={pasteState} title="Paste JSON state from clipboard" className={`${btn} bg-slate-800 hover:bg-slate-700 text-white border border-slate-700`}><Ic d={IO.paste} c="w-4 h-4" /><span className="hidden sm:inline">Paste</span></button>
          <button onClick={exportJson} title="Download operations state .json file" className={`${btn} bg-cyan-400 hover:bg-cyan-300 text-slate-950`}><Ic d={IO.down} c="w-4 h-4" /><span className="hidden sm:inline">Export</span></button>
          <button onClick={() => fileRef.current.click()} title="Import operations state .json file" className={`${btn} bg-purple-500 hover:bg-purple-400 text-white`}><Ic d={IO.up} c="w-4 h-4" /><span className="hidden sm:inline">Import</span></button>
          <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={importFile} />
        </div>
      </header>

      <aside className={`hidden md:flex fixed left-0 top-0 bottom-0 ${collapsed ? "w-16 px-2" : "w-56 px-4"} bg-slate-900 border-r border-slate-800 flex-col py-4 z-40 transition-all`}>
        <div className={`mb-5 mt-1 flex items-center ${collapsed ? "justify-center" : "justify-between"}`}>
          {!collapsed ? (
            <div>
              <div className="font-bold leading-tight text-white">Mission Control</div>
              <div className="text-[10px] text-cyan-400 tracking-widest font-mono mt-0.5">TREND DETECTIVE · v6.0</div>
            </div>
          ) : (
            <div className="font-bold text-cyan-400 font-mono text-sm" title="Mission Control · Trend Detective">MC</div>
          )}
        </div>
        <nav className="space-y-1 flex-1">
          {TABS.map(([k, l, d]) => (
            <button
              key={k}
              title={l}
              onClick={() => setTab(k)}
              className={`w-full flex items-center ${collapsed ? "justify-center px-2" : "gap-3 px-3"} py-2.5 rounded-xl text-sm font-medium transition ${tab === k ? "bg-cyan-400/15 text-cyan-300 border border-cyan-400/40" : "text-slate-400 hover:bg-slate-800 border border-transparent"}`}
            >
              <Ic d={d} />{!collapsed && <span>{l}</span>}
            </button>
          ))}
        </nav>
        {!collapsed && (
          <div className="pt-3 border-t border-slate-800 text-[11px] text-slate-400 space-y-1">
            <div className="font-mono text-slate-300">Window: 39h (~30h prod)</div>
            <div>Dual Layer + 7 Invariants</div>
            <div className="text-[10px] text-slate-500">Updated by: {s.updatedBy}</div>
          </div>
        )}
      </aside>

      <main className={`px-4 py-5 pb-28 md:pb-8 transition-all ${padLeft}`}>
        <div className={`md:px-2 ${tab === "tasks" ? "max-w-full" : "max-w-6xl"}`}>
          {tab === "cmd"   && <Command s={s} now={now} goTasksPhase={goTasksPhase} />}
          {tab === "tasks" && <Tasks s={s} now={now} say={say} initPhase={initPhase} clearInitPhase={() => setInitPhase(null)} mePerson={mePerson} />}
          {tab === "team"  && <Team s={s} />}
          {tab === "strat" && <Strategy />}
          {tab === "del"   && <Delivery s={s} now={now} />}
        </div>
      </main>

      <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 grid grid-cols-5" style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }}>
        {TABS.map(([k, l, d]) => (
          <button key={k} onClick={() => setTab(k)} className={`flex flex-col items-center gap-1 py-2.5 text-[10px] font-medium ${tab === k ? "text-cyan-300" : "text-slate-500"}`}>
            <Ic d={d} c="w-4 h-4" />{l}
          </button>
        ))}
      </nav>

      {/* Wi-Fi Network Connection / Status Modal */}
      {showLanModal && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">📡</span>
                <h3 className="font-bold text-white text-base">Real-Time Wi-Fi Network Sync (LAN)</h3>
              </div>
              <button onClick={() => setShowLanModal(false)} className="text-slate-400 hover:text-white text-sm font-mono p-1">✕</button>
            </div>

            {repo.lanStatus === "connected" ? (
              <div className="space-y-3">
                <div className="p-3.5 rounded-xl bg-emerald-950/40 border border-emerald-500/40 space-y-1.5">
                  <div className="flex items-center gap-2 text-emerald-300 font-semibold text-xs">
                    <span className="relative flex h-2.5 w-2.5">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    🟢 Live on Network with Team!
                  </div>
                  <div className="text-xs text-slate-300">
                    Connected server: <code className="bg-slate-950 px-2 py-0.5 rounded text-cyan-300 font-mono text-[11px] border border-slate-800">{repo.lanUrl}</code>
                  </div>
                  <p className="text-[11px] text-slate-400 leading-relaxed pt-1">
                    All changes to tasks, members, and gates made by you or other members are broadcast instantaneously via SSE (Server-Sent Events) to every computer on the team.
                  </p>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => {
                      repo.disconnectLan();
                      say("Disconnected from Wi-Fi network");
                      setShowLanModal(false);
                    }}
                    className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-900/70 hover:bg-rose-800 text-rose-200 border border-rose-700/50"
                  >
                    Disconnect from Network
                  </button>
                  <button
                    onClick={() => setShowLanModal(false)}
                    className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-cyan-400 hover:bg-cyan-300 text-slate-950"
                  >
                    Close
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-3.5 text-xs text-slate-300">
                <div className="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800 space-y-2">
                  <div className="font-semibold text-cyan-300 text-xs">How to pair the team on the same Wi-Fi:</div>
                  <ol className="list-decimal list-inside space-y-2 text-slate-300 text-[11px] leading-relaxed">
                    <li>
                      <b>On the host machine (one team member):</b> open a terminal in the <code>mission_control</code> folder and run:<br />
                      <code className="inline-block mt-1 bg-slate-900 text-emerald-400 px-2.5 py-1 rounded font-mono text-xs border border-slate-700 select-all">python3 sync_server.py</code>
                    </li>
                    <li>
                      <b>On team computers on the same Wi-Fi:</b> open the URL shown in the host terminal in a browser (e.g., <code className="text-cyan-300 font-mono">http://HOST_IP:8765</code>) or paste the address below to sync even when opening the file locally:
                    </li>
                  </ol>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-slate-400 text-[11px] font-mono">Wi-Fi Server Address (Host):</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-cyan-400"
                      value={lanInputUrl}
                      placeholder="http://192.168.1.X:8765 or http://localhost:8765"
                      onChange={e => setLanInputUrl(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === "Enter" && lanInputUrl.trim()) {
                          repo.connectLan(lanInputUrl);
                          setShowLanModal(false);
                          say("Connecting to Wi-Fi server...");
                        }
                      }}
                    />
                    <button
                      onClick={() => {
                        if (!lanInputUrl.trim()) return;
                        repo.connectLan(lanInputUrl);
                        setShowLanModal(false);
                        say("Connecting to Wi-Fi server...");
                      }}
                      className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950"
                    >
                      Connect
                    </button>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowLanModal(false)}
                    className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {pend && (
        <div className="fixed inset-x-3 bottom-24 md:bottom-6 md:left-64 z-50 bg-slate-900 border border-purple-500 rounded-2xl p-4 shadow-2xl">
          <b className="text-sm">Confirm JSON state import?</b>
          <p className="text-xs text-slate-400 my-2">{pend.info}. An automatic backup of the current state will be saved before replacing.</p>
          <div className="flex gap-2">
            <button onClick={() => { repo.replace(pend.st); setPend(null); say("State imported successfully (backup saved)"); }} className="bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-lg">Import Now</button>
            <button onClick={() => setPend(null)} className="bg-slate-700 text-xs px-4 py-2 rounded-lg">Cancel</button>
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-slate-950 text-sm font-semibold px-4 py-2 rounded-full shadow-lg max-w-[90vw] text-center">
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
