              <span className="font-mono text-[10px] text-cyan-300">[{t.phase || "F1"}]</span>
              <span className={`flex-1 truncate ${t.status === "DONE" ? "line-through text-slate-500" : "text-slate-200"}`}>{t.title}</span>
              <span className="text-[10px] font-mono text-slate-400 shrink-0">{nm(s, t.ownerId)}</span>
            </label>
          ))}
        </div>
        <div className="flex gap-2 mt-3">
          <input
            className={inp}
            placeholder="+ Adicionar entregável MUST ao escopo…"
            value={mv}
            onChange={e => setMv(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && mv.trim()) { repo.addTask({ id: uid(), title: mv.trim(), ownerId: repo.me || "", priority: "P0", due: "", status: "READY", blockedReason: "", moscow: "MUST", gateId: "", phase: "F4" }); setMv(""); } }}
          />
        </div>
      </Card>

      {/* MATRIZ DE RISCOS OPERACIONAIS R1-R7 */}
      <Card>
        <H right={<button onClick={() => repo.addRisk({ id: uid(), code: `R${s.risks.length + 1}`, problem: "", ownerId: repo.me || "", plan: "", state: "OPEN" })} className="text-xs text-cyan-300 font-semibold">+ Novo Risco</button>}>
          Matriz de Riscos Operacionais e Mitigação Preventiva (R1–R7)
        </H>
        {!s.risks.length && <p className="text-sm text-slate-500">Nenhum risco registrado.</p>}
        <div className="space-y-2 mt-2">
          {s.risks.map(r => (
            <div key={r.id} className={`grid sm:grid-cols-[1.2fr_auto_1.4fr_auto] gap-2 items-center p-2 rounded-xl border border-slate-800/80 bg-slate-950/40 ${r.state === "CLOSED" ? "opacity-50" : ""}`}>
              <Tx v={r.problem} on={v => repo.updateRisk(r.id, { problem: v })} placeholder="Risco e Gatilho de Alerta" />
              <Sel v={r.ownerId} on={v => repo.updateRisk(r.id, { ownerId: v })} o={mOpts(s, "Resp.")} c="text-xs" />
              <Tx v={r.plan} on={v => repo.updateRisk(r.id, { plan: v })} placeholder="Resposta Operacional Imediata" />
              <button
                onClick={() => repo.updateRisk(r.id, { state: r.state === "OPEN" ? "CLOSED" : "OPEN" })}
                className={`text-[11px] font-semibold px-3 py-1.5 rounded-lg ${r.state === "OPEN" ? "bg-amber-400 text-slate-950" : "bg-slate-700 text-slate-300"}`}
              >
                {r.state === "OPEN" ? "ATIVO" : "MITIGADO"}
              </button>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============ APLICAÇÃO PRINCIPAL (SHELL & SINCRONIZAÇÃO JSON) ============ */
const TABS = [
  ["cmd",   "Command",  "M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z M4 22v-7"],
  ["tasks", "Tasks",    "M6 5v11 M12 5v6 M18 5v14"],
  ["team",  "Team",     "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75"],
  ["strat", "Strategy", "M12 2L2 7l10 5 10-5-10-5z M2 17l10 5 10-5 M2 12l10 5 10-5"],
  ["del",   "Delivery", "m9 11 3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"]
];
const Ic = ({ d, c = "w-5 h-5" }) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>;
const IO = {
  copy:  "M10 8h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2",
  paste: "M8 2h8v4H8z M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2",
  down:  "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3",
  up:    "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12"
};

const SYNC = {
  live:       ["●", "Ao vivo", "text-emerald-300 border-emerald-500/50"],
  connecting: ["○", "Conectando…", "text-amber-300 border-amber-500/50"],
  readonly:   ["◐", "Somente leitura", "text-purple-300 border-purple-500/50"],
  offline:    ["✕", "Sem conexão", "text-rose-300 border-rose-500/50"],
  local:      ["●", "Salvo no navegador", "text-emerald-300 border-emerald-500/50"]
};
const SyncChip = () => {
  if (repo.lanStatus === "connected") {
    return (
      <span title={`Sincronização em tempo real ativa na LAN (${repo.lanUrl})`} className="text-[11px] font-semibold px-2 py-1 rounded-full border whitespace-nowrap text-emerald-300 border-emerald-500/50 flex items-center gap-1.5">
        <span className="relative flex h-2 w-2">
          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span className="hidden min-[430px]:inline">Ao vivo na LAN</span>
      </span>
    );
  }
  const [d, l, c] = SYNC[bus.status] || SYNC.local;
  return <span title={bus.lockMsg || "Persistência ativa em localStorage (mc-v6)"} className={`text-[11px] font-semibold px-2 py-1 rounded-full border whitespace-nowrap ${c}`}>{d}<span className="hidden min-[430px]:inline"> {l}</span></span>;
};

function App() {
  const s = useRepo();
  const [tab, setTab] = useState("cmd");
  const [initPhase, setInitPhase] = useState(null);
  const [now, setNow] = useState(clock.now());
  const [toast, setToast] = useState("");
  const [pend, setPend] = useState(null);
  const [collapsed, setCollapsed] = useState(() => ls.get("mc-sidebar") === "1");
  const [mePerson, setMePerson] = useState(() => ls.get("mc-me-person") || "");
  const [showLanModal, setShowLanModal] = useState(false);
  const [lanInputUrl, setLanInputUrl] = useState(() => repo.lanUrl || (typeof window !== "undefined" && window.location && window.location.protocol.startsWith("http") ? window.location.origin : "http://localhost:8765"));
  const fileRef = useRef(null);

  const toggleSidebar = () => {
    const next = !collapsed;
    setCollapsed(next);
    ls.set("mc-sidebar", next ? "1" : "0");
  };

  useEffect(() => {
    const i = setInterval(() => setNow(clock.now()), 1000);
    return () => clearInterval(i);
  }, []);

  const say = m => { setToast(m); setTimeout(() => setToast(""), 3500); };
  bus.say = say;

  const payload = () => JSON.stringify({ app: s.app, schema_version: "6.0", exported_at: nowIso(), exported_by: mePerson || repo.userName(), state: s }, null, 2);
  const exportJson = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload()], { type: "application/json" }));
    a.download = `trend-detective-mc-${nowIso().slice(0, 16).replace(/[:T]/g, "-")}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    say("Estado JSON exportado!");
  };
  const copyState = async () => {
    const t = payload();
    try {
      await navigator.clipboard.writeText(t);
      say("Estado JSON copiado! Cole no grupo da equipe");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      ta.remove();
      say(ok ? "Estado JSON copiado! Cole no grupo" : "Falha ao copiar");
    }
  };
  const prepare = txt => {
    try {
      const j = JSON.parse(txt);
      if (j.app !== undefined && j.app !== s.app) return say("Arquivo de outra aplicação");
      let st = j.state || j;
      const v = st.schema_version || j.schema_version;
      if (v === "2.0" || v === "3.0" || v === "4.0" || v === "5.0") st = migrate(st);
      else if (v !== "6.0") return say("Versão de schema não suportada");
      const r = validate(st);
      if (!r.ok) return say("Importação recusada: " + r.err);
      setPend({ st, info: `Tarefas ${s.tasks.length} → ${st.tasks.length} · Marcos ${s.gates.length} → ${st.gates.length} · rev v${s.version} → v${st.version}${j.exported_by ? " · por " + j.exported_by : ""}` });
    } catch (e) {
      say("JSON inválido");
    }
  };
  const pasteState = async () => {
    try { prepare(await navigator.clipboard.readText()); } catch (e) { say("Colar bloqueado pelo navegador: use o botão Importar arquivo"); }
  };
  const importFile = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => prepare(r.result);
    r.readAsText(f);
    e.target.value = "";
  };

  const goTasksPhase = pCode => {
    setInitPhase(pCode);
    setTab("tasks");
  };

  const handleMeChange = val => {
    if (val.startsWith("P:")) {
      const pName = val.slice(2);
      setMePerson(pName);
      ls.set("mc-me-person", pName);
      const firstRole = s.members.find(m => Array.isArray(m.assignees) && m.assignees.includes(pName));
      if (firstRole) repo.setMe(firstRole.id);
    } else {
      setMePerson("");
      ls.set("mc-me-person", "");
      repo.setMe(val);
    }
  };

  const cp = currentPhaseInfo(s, now);
  const peopleList = allPeople(s);
  const btn = "flex items-center gap-1.5 text-xs font-semibold px-2.5 sm:px-3 py-1.5 rounded-lg transition";
  const padLeft = collapsed ? "md:pl-20" : "md:pl-60";

  return (
    <div className="min-h-screen bg-slate-950 text-slate-200">
      <header className={`sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800 px-3 py-2 flex items-center gap-2 transition-all ${padLeft}`}>
        <button
          onClick={toggleSidebar}
          title={collapsed ? "Expandir barra lateral" : "Recolher barra lateral"}
          className="hidden md:inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-300 text-xs font-mono"
        >
          {collapsed ? "»" : "«"}
        </button>
        <SyncChip />
        <select
          aria-label="Quem sou eu"
          className="bg-slate-900 border border-slate-700 rounded-lg text-xs px-2 py-1.5 max-w-[165px]"
          value={mePerson ? `P:${mePerson}` : repo.me}
          onChange={e => handleMeChange(e.target.value)}
        >
          <option value="">Quem sou eu?</option>
          {peopleList.length > 0 && (
            <optgroup label="Por Pessoa (Multi-Cargo)">
              {peopleList.map(p => <option key={p.person} value={`P:${p.person}`}>👤 {p.person} ({p.roles.map(r => r.role).join("+")})</option>)}
            </optgroup>
          )}
          <optgroup label="Por Cargo">
            {s.members.map(m => <option key={m.id} value={m.id}>{memberLabel(m)}</option>)}
          </optgroup>
        </select>
        <span className="hidden lg:inline-flex items-center gap-1.5 text-xs font-mono px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-cyan-300">
          <span>Fase Atual:</span>
          <b>{cp.phase.code}</b>
          <span className="text-slate-400">({cp.phase.window})</span>
        </span>
        <div className="ml-auto flex items-center gap-1.5 flex-wrap">
          {/* Botão/Indicador de Rede Wi-Fi */}
          {repo.lanStatus === "connected" ? (
            <button
              onClick={() => { setLanInputUrl(repo.lanUrl || ""); setShowLanModal(true); }}
              title={`🟢 Ao Vivo na Rede (${repo.lanUrl}) · Clique para ver detalhes ou desconectar`}
              className={`${btn} bg-emerald-500/20 text-emerald-300 border border-emerald-500/50 hover:bg-emerald-500/30`}
            >
              <span className="relative flex h-2 w-2 mr-1">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </span>
              <span className="hidden sm:inline">Ao Vivo na Rede</span>
              <span className="sm:hidden">Rede</span>
            </button>
          ) : (
            <button
              onClick={() => { setLanInputUrl(repo.lanUrl || "http://localhost:8765"); setShowLanModal(true); }}
              title="Conectar sincronização em tempo real na rede Wi-Fi (LAN)"
              className={`${btn} bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700`}
            >
              <span className="mr-1">📡</span>
              <span className="hidden sm:inline">Rede Wi-Fi</span>
              <span className="sm:hidden">LAN</span>
            </button>
          )}

          <button onClick={copyState} title="Copiar estado JSON para a área de transferência" className={`${btn} bg-emerald-500 hover:bg-emerald-400 text-slate-950`}><Ic d={IO.copy} c="w-4 h-4" /><span className="hidden sm:inline">Copiar</span></button>
          <button onClick={pasteState} title="Colar estado JSON da área de transferência" className={`${btn} bg-slate-800 hover:bg-slate-700 text-white border border-slate-700`}><Ic d={IO.paste} c="w-4 h-4" /><span className="hidden sm:inline">Colar</span></button>
          <button onClick={exportJson} title="Baixar arquivo .json de estado da operação" className={`${btn} bg-cyan-400 hover:bg-cyan-300 text-slate-950`}><Ic d={IO.down} c="w-4 h-4" /><span className="hidden sm:inline">Exportar</span></button>
          <button onClick={() => fileRef.current.click()} title="Importar arquivo .json de estado da operação" className={`${btn} bg-purple-500 hover:bg-purple-400 text-white`}><Ic d={IO.up} c="w-4 h-4" /><span className="hidden sm:inline">Importar</span></button>
          <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={importFile} />
        </div>
      </header>

      <aside className={`hidden md:flex fixed left-0 top-0 bottom-0 ${collapsed ? "w-16 px-2" : "w-56 px-4"} bg-slate-900 border-r border-slate-800 flex-col py-4 z-40 transition-all`}>
        <div className={`mb-5 mt-1 flex items-center ${collapsed ? "justify-center" : "justify-between"}`}>
          {!collapsed ? (
            <div>
              <div className="font-bold leading-tight text-white">Mission Control</div>
              <div className="text-[10px] text-cyan-400 tracking-widest font-mono mt-0.5">TREND DETECTIVE · v6.0</div>
            </div>
          ) : (
            <div className="font-bold text-cyan-400 font-mono text-sm" title="Mission Control · Trend Detective">MC</div>
          )}
        </div>
        <nav className="space-y-1 flex-1">
          {TABS.map(([k, l, d]) => (
            <button
              key={k}
              title={l}
              onClick={() => setTab(k)}
              className={`w-full flex items-center ${collapsed ? "justify-center px-2" : "gap-3 px-3"} py-2.5 rounded-xl text-sm font-medium transition ${tab === k ? "bg-cyan-400/15 text-cyan-300 border border-cyan-400/40" : "text-slate-400 hover:bg-slate-800 border border-transparent"}`}
            >
              <Ic d={d} />{!collapsed && <span>{l}</span>}
            </button>
          ))}
        </nav>
        {!collapsed && (
          <div className="pt-3 border-t border-slate-800 text-[11px] text-slate-400 space-y-1">
            <div className="font-mono text-slate-300">Janela: 39h (~30h prod)</div>
            <div>Dupla Camada + 7 Invariantes</div>
            <div className="text-[10px] text-slate-500">Atualizado por: {s.updatedBy}</div>
          </div>
        )}
      </aside>

      <main className={`px-4 py-5 pb-28 md:pb-8 transition-all ${padLeft}`}>
        <div className={`md:px-2 ${tab === "tasks" ? "max-w-full" : "max-w-6xl"}`}>
          {tab === "cmd"   && <Command s={s} now={now} goTasksPhase={goTasksPhase} />}
          {tab === "tasks" && <Tasks s={s} now={now} say={say} initPhase={initPhase} clearInitPhase={() => setInitPhase(null)} mePerson={mePerson} />}
          {tab === "team"  && <Team s={s} />}
          {tab === "strat" && <Strategy />}
          {tab === "del"   && <Delivery s={s} now={now} />}
        </div>
      </main>

      <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 grid grid-cols-5" style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }}>
        {TABS.map(([k, l, d]) => (
          <button key={k} onClick={() => setTab(k)} className={`flex flex-col items-center gap-1 py-2.5 text-[10px] font-medium ${tab === k ? "text-cyan-300" : "text-slate-500"}`}>
            <Ic d={d} c="w-4 h-4" />{l}
          </button>
        ))}
      </nav>

      {/* Modal de Conexão / Status da Rede Wi-Fi */}
      {showLanModal && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">📡</span>
                <h3 className="font-bold text-white text-base">Sincronização em Tempo Real na Rede Wi-Fi (LAN)</h3>
              </div>
              <button onClick={() => setShowLanModal(false)} className="text-slate-400 hover:text-white text-sm font-mono p-1">✕</button>
            </div>

            {repo.lanStatus === "connected" ? (
              <div className="space-y-3">
                <div className="p-3.5 rounded-xl bg-emerald-950/40 border border-emerald-500/40 space-y-1.5">
                  <div className="flex items-center gap-2 text-emerald-300 font-semibold text-xs">
                    <span className="relative flex h-2.5 w-2.5">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    🟢 Ao Vivo na Rede com a Equipe!
                  </div>
                  <div className="text-xs text-slate-300">
                    Servidor conectado: <code className="bg-slate-950 px-2 py-0.5 rounded text-cyan-300 font-mono text-[11px] border border-slate-800">{repo.lanUrl}</code>
                  </div>
                  <p className="text-[11px] text-slate-400 leading-relaxed pt-1">
                    Todas as alterações em tarefas, membros e marcos feitas por você ou pelos outros membros são transmitidas instantaneamente via SSE (Server-Sent Events) para todos os computadores da equipe.
                  </p>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => {
                      repo.disconnectLan();
                      say("Desconectado da rede Wi-Fi");
                      setShowLanModal(false);
                    }}
                    className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-900/70 hover:bg-rose-800 text-rose-200 border border-rose-700/50"
                  >
                    Desconectar da Rede
                  </button>
                  <button
                    onClick={() => setShowLanModal(false)}
                    className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-cyan-400 hover:bg-cyan-300 text-slate-950"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-3.5 text-xs text-slate-300">
                <div className="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800 space-y-2">
                  <div className="font-semibold text-cyan-300 text-xs">Como parear a equipe no mesmo Wi-Fi:</div>
                  <ol className="list-decimal list-inside space-y-2 text-slate-300 text-[11px] leading-relaxed">
                    <li>
                      <b>Na máquina host (um dos membros):</b> abra o terminal na pasta <code>mission_control</code> e execute:<br />
                      <code className="inline-block mt-1 bg-slate-900 text-emerald-400 px-2.5 py-1 rounded font-mono text-xs border border-slate-700 select-all">python3 sync_server.py</code>
                    </li>
                    <li>
                      <b>Nos computadores da equipe no mesmo Wi-Fi:</b> acesse no navegador o endereço exibido no terminal do host (ex.: <code className="text-cyan-300 font-mono">http://IP_DO_HOST:8765</code>) ou cole o endereço abaixo para sincronizar mesmo se abrir o arquivo localmente:
                    </li>
                  </ol>
                </div>

                <div className="space-y-1.5">
                  <label className="block text-slate-400 text-[11px] font-mono">Endereço do Servidor Wi-Fi (Host):</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-cyan-400"
                      value={lanInputUrl}
                      placeholder="http://192.168.1.X:8765 ou http://localhost:8765"
                      onChange={e => setLanInputUrl(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === "Enter" && lanInputUrl.trim()) {
                          repo.connectLan(lanInputUrl);
                          setShowLanModal(false);
                          say("Conectando ao servidor Wi-Fi...");
                        }
                      }}
                    />
                    <button
                      onClick={() => {
                        if (!lanInputUrl.trim()) return;
                        repo.connectLan(lanInputUrl);
                        setShowLanModal(false);
                        say("Conectando ao servidor Wi-Fi...");
                      }}
                      className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950"
                    >
                      Conectar
                    </button>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowLanModal(false)}
                    className="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700"
                  >
                    Cancelar
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {pend && (
        <div className="fixed inset-x-3 bottom-24 md:bottom-6 md:left-64 z-50 bg-slate-900 border border-purple-500 rounded-2xl p-4 shadow-2xl">
          <b className="text-sm">Confirmar importação de estado JSON?</b>
          <p className="text-xs text-slate-400 my-2">{pend.info}. Um backup automático do estado atual será salvo antes da substituição.</p>
          <div className="flex gap-2">
            <button onClick={() => { repo.replace(pend.st); setPend(null); say("Estado importado com sucesso (backup salvo)"); }} className="bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-lg">Importar Agora</button>
            <button onClick={() => setPend(null)} className="bg-slate-700 text-xs px-4 py-2 rounded-lg">Cancelar</button>
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-slate-950 text-sm font-semibold px-4 py-2 rounded-full shadow-lg max-w-[90vw] text-center">
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
