name: Earth System Trend Detective CI

on:
  push:
    branches: [main, develop, frontend, mapa, data, stats_engine]
  pull_request:
    branches: [main, develop, frontend, mapa, data, stats_engine]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run data/ contract & ingestion tests (when present)
        run: |
          if [ -d "data/tests" ]; then
            python3 -B -m unittest discover -s data/tests -p "test_*.py" -v
          elif [ -d "data" ]; then
            python3 -B -m compileall -q data
            echo "data/tests/ absent in this branch — Python syntax check passed."
          else
            echo "data/ absent in this branch — skipping data tests."
          fi

      - name: Run backend/ statistical & copilot tests (when present)
        run: |
          if [ -d "backend" ]; then
            python3 -B -m unittest discover -s backend -p "test_*.py" -v
          else
            echo "backend/ absent in this branch — skipping backend tests."
          fi

  frontend-e2e:
    name: Frontend Typecheck, Unit, Offline Audit & Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate precomputed global grids
        run: npm run validate:grids

      - name: Build production bundle
        run: npm run build

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Verify 100% offline bundle integrity
        run: npm run verify:offline

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run real-browser E2E suite against vite preview
        run: npm run test:e2e

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
